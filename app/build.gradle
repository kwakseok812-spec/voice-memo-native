plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace = "com.kwak.camtest"
    compileSdk = 34
    defaultConfig {
        applicationId "com.kwak.voicememo.camtest"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1-proto"
    }
    signingConfigs {
        release {
            if (project.hasProperty('camStoreFile')) {
                storeFile file(project.property('camStoreFile'))
                storePassword project.property('camStorePassword')
                keyAlias project.property('camKeyAlias')
                keyPassword project.property('camKeyPassword')
            }
        }
    }
    buildTypes {
        debug {
            debuggable false
            if (project.hasProperty('camStoreFile')) { signingConfig signingConfigs.release }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    def camerax = "1.3.4"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-ktx:1.9.1"
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
}
