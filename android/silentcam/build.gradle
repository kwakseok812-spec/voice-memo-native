// 소리 없는 카메라(O-0607): 문서·영수증 스캔과 「카메라」 칸이 쓰는 촬영 화면. 시제품 camtest(CameraX 1.3.4)에서 소리가 나지 않음을 확인한 같은 버전을 그대로 쓴다.
//  - 코틀린은 이 모듈 안에서만 쓴다(미러링 모듈과 같은 방식). 앱 모듈(:app)과 맨 위 build.gradle 은 자바 그대로다.
//  - 권한(CAMERA)·화면 선언은 이 모듈의 AndroidManifest.xml 에 있고, 빌드 때 앱 매니페스트에 합쳐진다.
//  - 떼어 내려면: settings.gradle 의 include ':silentcam' · app/build.gradle 의 implementation project(':silentcam') ·
//    SilentCameraPlugin.java 와 MainActivity 의 등록 한 줄을 지우면 된다(JS 는 플러그인이 없으면 예전 길로 간다).
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "com.kwak.silentcam"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    lint {
        abortOnError = false
    }
}

dependencies {
    // 시험(camtest)에서 소리 없음을 확인한 버전으로 고정 — 새 버전으로 올리면 그 근거가 사라진다.
    def camerax = "1.3.4"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    // 줌(확대) 화면이 카메라 상태·배율 값(LiveData)을 직접 읽는다 — camera-core 가 끌어오는 것에 기대지 않고 명시한다
    implementation "androidx.lifecycle:lifecycle-livedata-core:2.8.7"
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    // 복구 목록·청소 규칙 단위 시험(./gradlew :silentcam:testDebugUnitTest) — 앱에 들어가는 라이브러리는 없다
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20231013"
}
