name: Build camtest proto APK
on:
  push:
    branches: [ proto-silent-cam ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Accept licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: Restore keystore (from secret)
        run: echo "$ANDROID_KEYSTORE_B64" | base64 -d > app/cam.keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace \
            -PcamStoreFile=cam.keystore \
            -PcamStorePassword="$P1" -PcamKeyAlias="$P2" -PcamKeyPassword="$P3"
        env:
          P1: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P2: ${{ secrets.ANDROID_KEY_ALIAS }}
          P3: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Show permissions
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee perms.txt
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E "package:|application-label" | tee -a perms.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee -a perms.txt
          cp app/build/outputs/apk/debug/app-debug.apk camtest-v1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: camtest-apk
          path: |
            camtest-v1.apk
            perms.txt
          if-no-files-found: error
