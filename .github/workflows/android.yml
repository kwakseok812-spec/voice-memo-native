name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      # ubuntu-latest 러너엔 Android SDK 가 이미 설치돼 있음(ANDROID_HOME 세팅됨).
      # 라이선스만 수락하고 gradle 이 필요한 build-tools/platform 을 알아서 받게 한다.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      # google-services.json 은 공개 저장소에 올리지 않고 암호화 Secret 에 보관한다.
      # 빌드할 때만 복원한다(없으면 FCM 초기화가 안 돼 푸시 알림이 죽는다).
      - name: Restore google-services.json (from secret)
        run: echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON }}
      - name: Install JS deps
        run: npm ci
      - name: Capacitor sync (copy web + plugins into android)
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-memo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
