name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      # ubuntu-latest 러너엔 Android SDK 가 이미 설치돼 있음(ANDROID_HOME 세팅됨).
      # 라이선스만 수락하고 gradle 이 필요한 build-tools/platform 을 알아서 받게 한다.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      # google-services.json 은 공개 저장소에 올리지 않고 암호화 Secret 에 보관한다.
      # 빌드할 때만 복원한다(없으면 FCM 초기화가 안 돼 푸시 알림이 죽는다).
      - name: Restore google-services.json (from secret)
        run: echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON }}
      # 고정 release keystore 를 Secret(base64)에서 복원한다.
      # 이 키로 서명해야 새 버전 설치 때 "패키지 충돌" 없이 덮어설치가 된다.
      # 복원한 keystore 는 커밋되지 않으며(빌드 순간에만 존재), 로그에도 노출하지 않는다.
      - name: Restore release keystore (from secret)
        run: echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/smart-assistant-release.keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      - name: Install JS deps
        run: npm ci
      - name: Capacitor sync (copy web + plugins into android)
        run: npx cap sync android
      - name: Build debug APK (signed with fixed release key)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -PsmartStoreFile=smart-assistant-release.keystore \
            -PsmartStorePassword="$ANDROID_KEYSTORE_PASSWORD" \
            -PsmartKeyAlias="$ANDROID_KEY_ALIAS" \
            -PsmartKeyPassword="$ANDROID_KEY_PASSWORD"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-memo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
