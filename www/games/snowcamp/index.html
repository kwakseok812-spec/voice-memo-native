<!doctype html>
<html lang="ko">
<head>

<title>눈밭 캠프</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#e6f1fa;font-family:system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;display:block;touch-action:none}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5}
.ov[hidden]{display:none}
#menu{background:linear-gradient(#cfe6f7,#f2f8fd 60%,#fff)}
#menu h1{margin:0;font-size:44px;color:#25607a;text-shadow:0 3px 0 #fff;letter-spacing:-1px}
#mSceneImg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .45s}
#mSceneImg.on{opacity:1}
#mScene{position:relative;overflow:hidden;background:linear-gradient(#b9cde0,#e8f1f8);width:min(300px,76vw);aspect-ratio:4/3;border-radius:18px;background-size:cover;background-position:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#mGoal{margin:0;font-size:16px;font-weight:800;color:#25607a}
#menu h1{font-size:38px}
#note{margin:0;max-width:80vw;text-align:center;font-size:15px;font-weight:700;color:#b85c1e;background:#fff3df;border-radius:12px;padding:8px 14px}
#note[hidden]{display:none}
.btn{border:0;border-radius:18px;padding:15px 34px;font-size:20px;font-weight:800;color:#fff;background:#3fae5c;box-shadow:0 5px 0 #2a8443;min-width:200px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #2a8443}
.btn.b2{background:#4a90d9;box-shadow:0 5px 0 #2f6cab}
.btn.b2:active{box-shadow:0 2px 0 #2f6cab}
.btn.b3{background:#9aa7b3;box-shadow:0 5px 0 #707d89}
#quit,#win,#pz{background:rgba(20,40,60,.45)}
#pz{z-index:6}
.card{background:#fff;border-radius:22px;padding:24px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:86vw}
.card h2{margin:0;font-size:24px;color:#25607a}
.card p{margin:0;color:#456;font-size:16px}
#bMenu,#bSnd{display:flex;align-items:center;justify-content:center;padding:0}
#bMenu{position:fixed;left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));z-index:3;width:44px;height:44px;border-radius:14px;border:0;background:rgba(255,255,255,.85);font-size:22px;color:#25607a;box-shadow:0 2px 6px rgba(0,0,0,.2)}
#bMenu[hidden]{display:none}
#bSnd{position:fixed;left:calc(62px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));z-index:3;width:44px;height:44px;border-radius:14px;border:0;background:rgba(255,255,255,.85);font-size:20px;color:#25607a;box-shadow:0 2px 6px rgba(0,0,0,.2)}
#bSnd[hidden]{display:none}
#bFit{position:fixed;left:calc(114px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));z-index:3;width:44px;height:44px;border-radius:14px;border:0;background:rgba(255,255,255,.85);box-shadow:0 2px 6px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;padding:0;transition:background .15s,transform .1s}
#bFit:active{transform:scale(.92)}
#bFit.on{background:#25607a}
#bFit.on path{stroke:#fff}
#bFit[hidden]{display:none}
#story{background:rgba(10,24,40,.7)}
.scard{background:#fff;border-radius:22px;padding:14px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);width:min(340px,88vw)}
#sImg{width:100%;aspect-ratio:4/3;border-radius:14px;background:linear-gradient(#6f8fb0,#dbe9f5);background-size:cover;background-position:center}
.card p,.scard p{word-break:keep-all}
.scard p{margin:0;color:#2b4055;font-size:17px;font-weight:700;line-height:1.5;text-align:center;min-height:52px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
/* 6판 2단계: 시작 화면 간판·목표, 일지, 결과 지도 */
#mHero{position:relative;width:min(340px,86vw);aspect-ratio:4/3;margin-top:34px}
#mHero #mScene{width:100%}
#mSign{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);width:86%;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
#mTower{position:absolute;right:-5%;top:-27%;width:40%;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
#mTip{position:absolute;right:31%;top:-15%;background:#fff;color:#25607a;font-size:12.5px;font-weight:900;padding:5px 10px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.22);white-space:nowrap}
#mTip:after{content:'';position:absolute;right:-6px;top:50%;margin-top:-6px;border:6px solid transparent;border-left-color:#fff;border-right:0}
#mTip b{color:#e07a10}
#mRec{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(340px,88vw)}
.rt{background:rgba(255,255,255,.92);border-radius:14px;padding:8px 4px 7px;box-shadow:0 2px 6px rgba(37,96,122,.18);display:flex;flex-direction:column;align-items:center;gap:1px;border:0;font:inherit;color:#25607a;min-height:64px;justify-content:center}
.rt b{font-size:16px;font-weight:900;display:flex;align-items:center;gap:3px;white-space:nowrap}
.rt span{font-size:11px;color:#6a7b8c;font-weight:700}
button.rt{cursor:pointer;box-shadow:0 3px 0 #b9cddc,0 2px 6px rgba(37,96,122,.18)}
button.rt:active{transform:translateY(2px);box-shadow:0 1px 0 #b9cddc}
#menu{gap:12px}
#mTower .lit{animation:twk 2.4s ease-in-out infinite}
@keyframes twk{0%,100%{opacity:.25}50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){#mTower .lit{animation:none;opacity:.45}}
#mProg{display:flex;gap:6px;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#25607a;min-height:18px}
#mProg i{width:10px;height:10px;border-radius:50%;background:#c9d7e3;display:inline-block}
#mProg i.on{background:#ffb627;box-shadow:0 0 0 2px #fff3c4}
.mBtns{display:flex;flex-direction:column;gap:12px;align-items:center}
.btn.small{min-width:0;padding:10px 22px;font-size:16px;border-radius:14px}
#journal,#jcard,#mapv{background:rgba(10,24,40,.78);z-index:8}
/* 8판: 마을 지도(메뉴에서 여는 지도 — 결과 화면 지도와 같은 그림 함수) */
#bMap[hidden]{display:none}
#mNew{border:0;border-radius:14px;background:linear-gradient(90deg,#2f7bb0,#6b5fc0);color:#fff;font:inherit;font-size:14px;font-weight:800;padding:9px 16px;box-shadow:0 3px 0 #23507a;cursor:pointer;animation:pop .4s ease-out}
#mNew[hidden]{display:none}
.mvgift{margin:0;font-size:12.5px;font-weight:800;color:#5a4a20;background:#fff6d8;border-radius:10px;padding:7px 10px;text-align:center}
#mvMap g[role=button]:focus{outline:none}
#mvMap g[role=button]:focus rect:nth-child(3){stroke:#2f7bd0}
#mRec.m4{grid-template-columns:repeat(4,1fr);width:min(372px,94vw)}
#mRec.m4 .rt{padding:8px 2px 7px}
#mRec.m4 .rt b{font-size:15px}
#mRec.m4 .rt span{font-size:10.5px;letter-spacing:-.4px}
.mvwrap{background:#f4f8fc;border-radius:20px;padding:12px 12px 16px;width:min(380px,94vw);max-height:92vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:10px}
.mvhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mvhead h2{margin:0 0 0 4px;font-size:20px;color:#25607a}
#mvMap svg{display:block;border-radius:14px}
#mvmapLake:focus{outline:none}
#mvmapLake:focus .mhit{stroke:#2f7bd0;stroke-width:2}
.mvrow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 2px 6px rgba(37,96,122,.16);border:0;font:inherit;text-align:left;width:100%;min-height:56px;color:#25607a}
button.mvrow{cursor:pointer}
button.mvrow:active{transform:translateY(1px)}
.mvrow .mvt{flex:1;display:flex;flex-direction:column;gap:2px}
.mvrow .mvt b{font-size:16px;font-weight:900}
.mvrow .mvt span{font-size:12px;color:#6a7b8c;font-weight:700}
.mvrow .mvgo{font-size:13px;font-weight:900;color:#fff;background:#3fae5c;border-radius:12px;padding:8px 12px;white-space:nowrap}
.mvrow.lock{background:#e9eef3;color:#6a7b8c}
.mvrow.lock .mvgo{background:#2f7bd0}
.mvrow.cur{box-shadow:0 0 0 2px #ffb627,0 2px 6px rgba(37,96,122,.16)}
@media (min-width:700px){.mvwrap{width:min(560px,92vw)}}
#jcard{z-index:9}
#story{z-index:7}
.jwrap{background:#f6f1e6;border-radius:20px;padding:14px 12px 16px;width:min(380px,94vw);max-height:92vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;gap:10px}
.jwrap h2{margin:0;font-size:20px;color:#5a3d22}
.jgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.jc{background:#fff;border-radius:10px;padding:4px 4px 6px;box-shadow:0 2px 4px rgba(90,60,30,.25);display:flex;flex-direction:column;gap:3px;align-items:center;border:0;font:inherit}
.jc .ji{width:100%;aspect-ratio:4/3;border-radius:7px;background:#2c3a4a center/cover no-repeat}
.jc.lock .ji{filter:grayscale(1) brightness(.25);}
.jc b{font-size:11px;color:#4a3420;line-height:1.2;text-align:center;word-break:keep-all}
.jc.lock b{color:#9a8f84}
.jc span{font-size:10px;color:#8a7a68}
#jcard .scard p{min-height:0}
#jcard .jbig{width:100%;aspect-ratio:4/3;border-radius:14px;background:#2c3a4a center/cover no-repeat}
#win .card{gap:8px;padding:16px 16px 18px;max-height:96vh;overflow:auto}
#winMap{width:100%;max-width:300px}
.wrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.wrow .btn{min-width:0;padding:11px 16px;font-size:16px}
#wNext{padding:7px 16px 6px;line-height:1.15}
#wNext small{display:block;font-size:11px;font-weight:700;opacity:.9}
.mlock{animation:lk 2.4s ease-in-out infinite}
@keyframes lk{0%,30%,100%{transform:rotate(0)}8%{transform:rotate(-12deg)}16%{transform:rotate(9deg)}24%{transform:rotate(-4deg)}}
#mapLake:focus{outline:none}
#mapLake:focus .mhit{stroke:#2f7bd0;stroke-width:2}
@media (prefers-reduced-motion:reduce){.mlock{animation:none}}
#sWho{display:flex;align-items:center;gap:8px;font-weight:800;color:#25607a;font-size:14px;min-height:0}
#sWho img{width:34px;height:34px;border-radius:50%;background:#dbe9f5;object-fit:cover}
#sWho[hidden]{display:none}
.scard{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.86);opacity:.3}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.scard{animation:none}}
</style>
</head>

<button id="bMenu" aria-label="메뉴" hidden><svg width="20" height="20" viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14" stroke="#25607a" stroke-width="2.6" stroke-linecap="round"/></svg></button>

<div id="menu" class="ov">
 <div id="mHero"><div id="mScene"><div id="mSceneImg"></div></div>

  <svg id="mSign" viewBox="0 0 280 64" aria-label="솔바람 고개 전초기지"><rect x="30" y="40" width="8" height="24" fill="#6b4423"/><rect x="242" y="40" width="8" height="24" fill="#6b4423"/><rect x="6" y="6" width="268" height="40" rx="8" fill="#a8693a"/><rect x="10" y="10" width="260" height="32" rx="6" fill="#d39a5c"/><path d="M6 12 Q20 2 40 8 Q70 0 100 7 Q140 0 180 7 Q220 0 250 8 Q266 3 274 12 L274 8 Q260 0 6 8Z" fill="#fff"/><text x="140" y="33" text-anchor="middle" font-size="19" font-weight="900" fill="#4a2a12" font-family="system-ui,Malgun Gothic,sans-serif">솔바람 고개 전초기지</text></svg>
 </div>
 <h1 style="margin-top:14px">눈밭 캠프</h1>
 <p id="mGoal">목표: 고개 위 신호탑에 불을 켜자</p>
 <div id="mProg"></div>
 <p id="note" hidden>새 판으로 바뀌어 처음부터 시작해요</p>
 <button id="mNew" hidden>새 마을: <b id="mNewN">서리못 나루</b> ›</button>

<script>
(function(){
'use strict';
/* ---------- 8판(O-0936) 마을 표: 마을마다 다른 값은 VIL.<마을>에 모은다. 지금 마을은 V(buildVillage가 고르고 다시 짓는다).
   아래 옛 이름(SAVE_KEY·ZB·WH·BENCH·PADS·MC·TUT·CHAP·STORY…)은 V의 값을 가리키는 별칭이다(1막 코드가 그대로 돈다) ---------- */
var VIL={camp:{id:'camp',name:'솔바람 고개',threat:'bears',
 keys:{save:'snowcamp.save',bak3:'snowcamp.save.v3bak',bak4:'snowcamp.save.v4bak',bak5:'snowcamp.save.v5bak',journal:'snowcamp.journal',best:'snowcamp.best',tut:'snowcamp.tut'}}},V=VIL.camp,VID='camp';
VIL.camp.giftKey='gem';VIL.camp.mapN=8;
var SAVE_KEY=V.keys.save,BAK_KEY=V.keys.bak3,BAK4_KEY=V.keys.bak4,BAK5_KEY=V.keys.bak5,JOUR_KEY=V.keys.journal,VER=6;
/* 8판 스위치(기본 켜짐): 주소에 ?act2=0 → 7판과 같은 모습(메뉴 「마을 지도」 칸 없음, 마을은 늘 솔바람 고개). 저장은 지우지 않는다 */
var SC_ACT2=!/[?&]act2=0/.test(location.search);
/* 8판 저장: snowcamp.meta = 지금 마을·선물, snowcamp.bak8 = 8판 첫 실행 때 1막 키 사본(한 번만) */
var META_KEY='snowcamp.meta',BAK8_KEY='snowcamp.bak8',BAK9_KEY='snowcamp.bak9',META=null;
/* 9판 스위치(기본 켜짐): ?act3=0 → 8판과 같은 모습(동쪽 순록 목장은 잠김 카드). ?act2=0이면 3막도 꺼짐. 3막 저장은 지우지 않는다 */
var SC_ACT3=SC_ACT2&&!/[?&]act3=0/.test(location.search);
function RANCH_ON(){return SC_ACT3&&!!VIL.ranch;}
/* 6판 채광 사슬 스위치(기본 켜짐). 주소에 ?mine0 → 5판 금광 */
