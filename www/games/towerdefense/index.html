<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07131d">
<meta name="color-scheme" content="dark">
<title>세균 방어전</title>
<style>
:root{
  --bg:#07131d; --bg2:#0d2230; --panel:#14304a; --panel2:#0e2234; --line:#25496a; --ink:#eef8fb; --dim:#8fb0c2;
  --gold:#ffd166; --bad:#ff6b6b; --mint:#5ef0b8; --acc:#3ec6e0; --pink:#ff7a93;
  --sans:"Pretendard","Noto Sans KR","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;
  --hud:48px; --foot:132px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{background:
  radial-gradient(60% 45% at 50% 38%,rgba(46,140,130,.22),transparent 70%),
  radial-gradient(120% 80% at 50% 0%,#11324a 0%,var(--bg) 62%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
svg{display:block}

/* 바깥 배경: 현미경 시야 속 떠다니는 세포 */
#deco{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#deco i{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(120,230,200,.05) 0 52%,rgba(140,240,215,.16) 58%,rgba(140,240,215,.03) 66%,transparent 70%);
  animation:drift 26s ease-in-out infinite alternate}
#deco i::after{content:"";position:absolute;left:34%;top:30%;width:22%;height:22%;border-radius:50%;background:rgba(150,240,215,.10)}
#deco .lens{border-radius:50%;background:none;border:1px solid rgba(140,240,215,.07);animation:none;box-shadow:0 0 0 18px rgba(140,240,215,.02)}
#deco .lens::after{display:none}
@keyframes drift{from{transform:translate(0,0) rotate(0)}to{transform:translate(30px,-40px) rotate(25deg)}}

#stage{position:fixed;inset:0;z-index:1;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{width:min(100vw, calc((100vh - var(--hud) - var(--foot) - 8px) * .75), 560px);
     width:min(100vw, calc((100dvh - var(--hud) - var(--foot) - 8px) * .75), 560px);position:relative;isolation:isolate}
@media (min-width:640px) and (min-height:620px){
  #app{width:min(100vw, calc((100vh - var(--hud) - var(--foot) - 48px) * .75), 560px);
       width:min(100vw, calc((100dvh - var(--hud) - var(--foot) - 48px) * .75), 560px)}
  #app::before{content:"";position:absolute;inset:-14px -16px -12px;z-index:-1;border-radius:28px;
    background:linear-gradient(180deg,rgba(24,58,84,.85),rgba(9,24,36,.92));
    border:1px solid rgba(140,230,215,.14);box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06)}
}

/* 위 칩 */
#hud{height:var(--hud);display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 6px}
.chip{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 8px;border-radius:999px;min-width:84px;justify-content:center;
  background:linear-gradient(180deg,#1a3a55,#0f2639);border:1px solid rgba(255,255,255,.09);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 3px 8px rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.chip svg{width:20px;height:20px;flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.chip b{font-size:18px;font-weight:900;letter-spacing:-.3px;line-height:1}
.chip.hp b{color:#ffb0b8} .chip.gold b{color:var(--gold)}
.chip.wv .lb{font-size:12px;font-weight:800;color:var(--dim);margin-right:1px}
.chip.wv .of{font-size:13px;font-weight:800;color:var(--dim)}
.chip.bad{animation:bad .35s}
.chip.hit{animation:hit .45s}
@keyframes bad{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes hit{0%{background:linear-gradient(180deg,#c43c4a,#7a1d2a);transform:scale(1.14)}100%{transform:scale(1)}}

#cv{display:block;width:100%;aspect-ratio:3/4;border-radius:16px;background:#0f2c31;
  box-shadow:0 0 0 2px rgba(140,240,215,.16),0 0 0 6px rgba(6,18,28,.9),0 10px 30px rgba(0,0,0,.55);touch-action:none}

/* 아래 단추 */
#foot{height:var(--foot);padding:10px 4px 0;display:flex;flex-direction:column;gap:8px}
#row1{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;height:64px}
.tw{--tc:#3ec6e0;position:relative;border-radius:16px;padding:4px 6px 4px 4px;display:flex;align-items:center;justify-content:center;gap:4px;
  background:linear-gradient(180deg,#1b3a54,#112538);border:2px solid #24476a;box-shadow:0 4px 0 #071420,inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .12s,border-color .15s,box-shadow .15s,opacity .15s}
.tw:active{transform:translateY(3px);box-shadow:0 1px 0 #071420}
.tw canvas{width:44px;height:44px;flex:none;transition:transform .2s}
.tw .tx{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.tw .nm{font-weight:900;font-size:15px;letter-spacing:-.3px;line-height:1.1}
.tw .co{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.tw.on{border-color:var(--tc);background:linear-gradient(180deg,#21486a,#132c44);
  box-shadow:0 4px 0 #071420,0 0 0 3px color-mix(in srgb,var(--tc) 28%,transparent),0 0 18px color-mix(in srgb,var(--tc) 35%,transparent);transform:translateY(-2px)}
.tw.on canvas{transform:scale(1.08) rotate(-4deg)}
.tw.on:active{transform:translateY(2px)}
.tw:not(.on){border-color:color-mix(in srgb,var(--tc) 62%,#24476a);background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 20%,#1b3a54),color-mix(in srgb,var(--tc) 8%,#112538))}
.tw .ds{font-size:10.5px;font-weight:800;color:color-mix(in srgb,var(--tc) 80%,#fff);letter-spacing:-.2px;line-height:1;white-space:nowrap}
.tw.poor .co{color:#ff9a9a}
.tw.hello{animation:hello .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes hello{0%{transform:translateY(0)}40%{transform:translateY(-9px) scale(1.06)}100%{transform:translateY(0)}}
.coin{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 32%,#fff6cf 0 18%,#ffd34d 45%,#c98a12 100%);box-shadow:inset 0 0 0 1.5px #9a650a}

#panel{display:none;grid-template-columns:1.55fr 1fr .62fr;gap:8px;height:64px}
#panel.show{display:grid;animation:rise .2s ease-out}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.pb{border-radius:16px;font-weight:900;font-size:14px;letter-spacing:-.3px;padding:4px 6px;display:flex;align-items:center;justify-content:center;gap:4px;
  background:linear-gradient(180deg,#1b3a54,#112538);border:2px solid #24476a;box-shadow:0 4px 0 #071420,inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .12s,box-shadow .12s,opacity .15s,background .15s}
.pb:active{transform:translateY(3px);box-shadow:0 1px 0 #071420}
.pb canvas{width:38px;height:38px;flex:none}
.pb .tx{display:flex;flex-direction:column;align-items:flex-start;gap:3px;line-height:1.1}
.pb small{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--gold)}
.pb small.nocoin .coin{display:none}
.pb.up{border-color:#3fa874;background:linear-gradient(180deg,#1f5040,#123327)}
.pb.up:not([disabled]){border-color:#8dffc0;background:linear-gradient(180deg,#2b7a58,#17513a);box-shadow:0 4px 0 #071420,0 0 14px rgba(94,240,184,.5),inset 0 1px 0 rgba(255,255,255,.18);animation:upglow 1s ease-in-out infinite alternate}
@keyframes upglow{to{box-shadow:0 4px 0 #071420,0 0 24px rgba(94,240,184,.85),inset 0 1px 0 rgba(255,255,255,.18)}}
.pb.up.max{border-color:#caa64a;background:linear-gradient(180deg,#4a4020,#2c2512)}
.pb small.dl{color:#b9f5d6;font-size:11.5px;white-space:nowrap}
.pb.up #bUpT{white-space:nowrap}
.pb.sell{border-color:#a8574a;background:linear-gradient(180deg,#4c2a26,#2e1816);flex-direction:column;gap:3px}
.pb.sell .tx{align-items:center}
.pb.sell.armed{background:linear-gradient(180deg,#b23b30,#7a221b);border-color:#ff9c8a;color:#fff;animation:arm .5s ease-in-out infinite alternate}
@keyframes arm{to{box-shadow:0 4px 0 #071420,0 0 16px rgba(255,120,100,.6)}}
.pb.close svg{width:22px;height:22px;opacity:.85}
.pb[disabled]{opacity:.42}

#row2{display:grid;grid-template-columns:1fr 84px;gap:8px}
#go{height:50px;border-radius:16px;font-weight:900;font-size:18px;letter-spacing:-.3px;color:#05291b;
  background:linear-gradient(180deg,#7ff7c4 0%,#3bd88f 48%,#25b874 100%);box-shadow:0 4px 0 #157049,inset 0 1px 0 rgba(255,255,255,.6),0 6px 16px rgba(40,200,130,.25);
  transition:transform .1s,box-shadow .1s,filter .15s}
#go:active{transform:translateY(4px);box-shadow:0 0 0 #157049}
#go[disabled]{filter:grayscale(.85) brightness(.6);box-shadow:0 4px 0 #0c2a1e}
#go.pulse:not([disabled]){animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.03);box-shadow:0 4px 0 #157049,inset 0 1px 0 rgba(255,255,255,.6),0 0 26px rgba(94,240,184,.55)}}
#spd{height:50px;border-radius:16px;font-weight:900;font-size:18px;
  background:linear-gradient(180deg,#1b3a54,#112538);border:2px solid #24476a;box-shadow:0 4px 0 #071420;transition:transform .1s,box-shadow .1s,background .15s}
#spd:active{transform:translateY(3px);box-shadow:0 1px 0 #071420}
#spd.fast.fast3{background:linear-gradient(180deg,#7a2f1a,#47160a);border-color:#ff9a5c;color:#ffb078}
#spd.fast{background:linear-gradient(180deg,#6a531a,#3d2f0c);border-color:var(--gold);color:var(--gold)}

/* 승리·패배 */
#ov{position:absolute;left:0;right:0;top:var(--hud);aspect-ratio:3/4;display:none;align-items:center;justify-content:center;border-radius:16px;
  background:radial-gradient(80% 60% at 50% 45%,rgba(10,30,44,.55),rgba(4,10,16,.86))}
#ov.show{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
#ov .box{width:min(86%,330px);text-align:center;padding:14px 18px 20px;border-radius:24px;
  background:linear-gradient(180deg,#183a55,#0c1f30);border:1px solid rgba(140,240,215,.18);box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);
  animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
#ov.lose .box{border-color:rgba(255,120,130,.25)}
@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}
#ovArt{width:100%;aspect-ratio:16/10;display:block}
#ov h1{margin:2px 0 6px;font-size:40px;font-weight:900;letter-spacing:-1px;line-height:1.1}
#ov.win h1{background:linear-gradient(180deg,#fff2b8,#ffd166 55%,#f0a020);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
#ov.lose h1{color:#ffa3ab}
#ov p{margin:0 0 16px;color:var(--dim);font-size:15px;font-weight:700}
.bigbtn{height:56px;padding:0 40px;border-radius:18px;font-weight:900;font-size:20px;letter-spacing:-.3px;color:#05291b;
  background:linear-gradient(180deg,#7ff7c4 0%,#3bd88f 48%,#25b874 100%);box-shadow:0 5px 0 #157049,inset 0 1px 0 rgba(255,255,255,.6),0 8px 22px rgba(40,200,130,.3);
  transition:transform .1s,box-shadow .1s}
.bigbtn:active{transform:translateY(5px);box-shadow:0 0 0 #157049}

/* 시작 화면 */
#start{position:absolute;inset:-2px -2px -16px;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:18px;
  background:radial-gradient(70% 50% at 50% 40%,rgba(30,90,95,.55),transparent 75%),linear-gradient(180deg,#0b2233,#07131d)}
#start.hide{animation:out .35s ease-in forwards}
@keyframes out{to{opacity:0;transform:scale(1.04)}}
#startArt{width:min(92%,380px);aspect-ratio:16/10;display:block}
#start h1{margin:4px 0 0;font-size:clamp(40px,12vw,58px);font-weight:900;letter-spacing:-2px;line-height:1;
  background:linear-gradient(180deg,#f2fffb 0%,#8ff5d0 45%,#2fc59a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #0a3a30) drop-shadow(0 8px 18px rgba(60,240,180,.25))}
#start .tag{font-size:12px;font-weight:800;letter-spacing:6px;color:#6fb9a8;margin:8px 0 26px;padding-left:6px}
#startBtn{animation:pulse2 1.3s ease-in-out infinite}
@keyframes pulse2{50%{transform:scale(1.05)}}

@media (prefers-reduced-motion:reduce){
  #go.pulse:not([disabled]),#startBtn,#deco i,.pb.sell.armed,.pb.up:not([disabled]){animation:none}
  #ov.show,#ov .box,#panel.show,#start.hide{animation:none}
  #start.hide{opacity:0}
  .chip.bad,.chip.hit{animation:none}
  .tw.on canvas{transform:none}
  .tw.hello{animation:none}
}
</style>
</head>
<body>
<div id="deco" aria-hidden="true">
 <i style="width:220px;height:200px;left:4%;top:8%"></i>
 <i style="width:140px;height:150px;left:78%;top:14%;animation-duration:31s"></i>
 <i style="width:260px;height:230px;left:70%;top:62%;animation-duration:36s"></i>
 <i style="width:120px;height:110px;left:12%;top:70%;animation-duration:22s"></i>
 <i style="width:90px;height:96px;left:30%;top:40%;animation-duration:28s"></i>
 <i style="width:80px;height:70px;left:88%;top:44%;animation-duration:24s"></i>
 <i class="lens" style="width:150vmin;height:150vmin;left:calc(50% - 75vmin);top:calc(50% - 75vmin)"></i>
</div>
<div id="stage">
 <div id="app">
  <div id="hud">
   <div class="chip hp" id="hp"><svg viewBox="0 0 24 24"><path fill="#ff5d73" d="M12 21l-1.4-1.3C5.4 15 2 11.9 2 8.1 2 5 4.4 2.6 7.5 2.6c1.7 0 3.4.8 4.5 2.1 1.1-1.3 2.8-2.1 4.5-2.1C19.6 2.6 22 5 22 8.1c0 3.8-3.4 6.9-8.6 11.6z"/><path fill="#fff" opacity=".55" d="M6.4 5.6c-1.4.3-2.4 1.5-2.4 3 0 .5.4.8.8.6.3-.1.4-.4.4-.7 0-.9.6-1.6 1.4-1.8.4-.1.6-.5.5-.8-.1-.3-.4-.4-.7-.3z"/></svg><b id="hpN">20</b></div>
   <div class="chip gold" id="gold"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="#c98a12"/><circle cx="12" cy="11.2" r="8.6" fill="#ffd34d"/><circle cx="12" cy="11.2" r="6" fill="none" stroke="#c98a12" stroke-width="1.4"/><path d="M9.2 7.6a4.8 4.8 0 0 1 3.6-1" stroke="#fff7d1" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg><b id="goldN">150</b></div>
   <div class="chip wv" id="wv"><svg viewBox="0 0 24 24"><g stroke="#3f8a3a" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></g><circle cx="12" cy="12" r="6.6" fill="#7bd96a" stroke="#3f8a3a" stroke-width="1.5"/><circle cx="9.7" cy="11.3" r="1.6" fill="#fff"/><circle cx="14.3" cy="11.3" r="1.6" fill="#fff"/><circle cx="10" cy="11.6" r=".8" fill="#17212b"/><circle cx="14.6" cy="11.6" r=".8" fill="#17212b"/></svg><span class="lb">파도</span><b id="wvN">1</b><span class="of">/10</span></div>
  </div>
  <canvas id="cv" aria-label="세균 방어전 게임 화면"></canvas>
  <div id="ov"><div class="box"><canvas id="ovArt"></canvas><h1 id="ovT">승리</h1><p id="ovP"></p><button id="again" class="bigbtn">다시 하기</button></div></div>
  <div id="foot">
   <div id="row1">
    <button class="tw on" data-t="bolt" style="--tc:#3ec6e0"><canvas class="ic"></canvas><span class="tx"><span class="nm">연발</span><span class="ds">빠름</span><span class="co"><i class="coin"></i>50</span></span></button>
    <button class="tw" data-t="blast" style="--tc:#ff9a3c"><canvas class="ic"></canvas><span class="tx"><span class="nm">폭발</span><span class="ds">범위</span><span class="co"><i class="coin"></i>90</span></span></button>
    <button class="tw" data-t="frost" style="--tc:#9ad8ff"><canvas class="ic"></canvas><span class="tx"><span class="nm">냉각</span><span class="ds">느리게</span><span class="co"><i class="coin"></i>70</span></span></button>
   </div>
   <div id="panel">
    <button class="pb up" id="bUp"><canvas id="bUpI"></canvas><span class="tx"><span id="bUpT">강화</span><small class="dl" id="bUpD"></small><small id="bUpC"><i class="coin"></i><span id="bUpCN"></span></small></span></button>
    <button class="pb sell" id="bSell"><span class="tx"><span id="bSellT">판매</span><small><i class="coin"></i><span id="bSellC"></span></small></span></button>
    <button class="pb close" id="bClose" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="#cfe3ee" stroke-width="3" stroke-linecap="round"/></svg></button>
   </div>
   <div id="row2">
    <button id="go" class="pulse">다음 파도 ▶</button>
    <button id="spd">1×</button>
   </div>
  </div>
  <div id="start"><canvas id="startArt"></canvas><h1>세균 방어전</h1><div class="tag">BACTERIA DEFENSE</div><button id="startBtn" class="bigbtn">시작</button></div>
 </div>
</div>
<script>
(function(){
'use strict';
const CELL=40, COLS=9, ROWS=12, W=360, H=480, TOTAL_WAVES=10;
const REDUCE = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const PF = REDUCE ? 0.3 : 1;
const TAU=Math.PI*2;
const FONT='"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif';

/* ---------- 길 ---------- */
const WP = [[-20,60],[300,60],[300,180],[60,180],[60,300],[300,300],[300,420],[100,420],[100,456]];
const segs=[]; let pathLen=0;
for(let i=0;i<WP.length-1;i++){
  const a=WP[i],b=WP[i+1],l=Math.hypot(b[0]-a[0],b[1]-a[1]);
  segs.push({a,b,l,s:pathLen,ang:Math.atan2(b[1]-a[1],b[0]-a[0])}); pathLen+=l;
}
function posAt(d){
  if(d<=0){return {x:WP[0][0],y:WP[0][1],ang:segs[0].ang};}
  for(const s of segs){ if(d<=s.s+s.l){const t=(d-s.s)/s.l;return {x:s.a[0]+(s.b[0]-s.a[0])*t,y:s.a[1]+(s.b[1]-s.a[1])*t,ang:s.ang};} }
  const s=segs[segs.length-1]; return {x:s.b[0],y:s.b[1],ang:s.ang};
}
const blocked=[]; for(let r=0;r<ROWS;r++){blocked.push(new Array(COLS).fill(false));}
for(const s of segs){
  const n=Math.ceil(s.l/4);
  for(let i=0;i<=n;i++){
    const x=s.a[0]+(s.b[0]-s.a[0])*i/n, y=s.a[1]+(s.b[1]-s.a[1])*i/n;
    const c=Math.floor(x/CELL), r=Math.floor(y/CELL);
    if(c>=0&&c<COLS&&r>=0&&r<ROWS) blocked[r][c]=true;
  }
}
blocked[11][2]=true; // 기지 칸
const nearPath=(c,r)=>{ for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const rr=r+dr,cc=c+dc; if(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS&&blocked[rr][cc]) return true;} return false; };

/* ---------- 정의 ---------- */
const TYPES={
  bolt :{name:'연발',cost:50,color:'#3ec6e0',lv:[{dmg:8,rng:100,cd:.45},{dmg:14,rng:108,cd:.38,up:40},{dmg:24,rng:118,cd:.3,up:70}]},
  blast:{name:'폭발',cost:90,color:'#ff9a3c',lv:[{dmg:22,rng:96,cd:1.4,sp:46},{dmg:36,rng:104,cd:1.3,sp:54,up:80},{dmg:56,rng:112,cd:1.2,sp:62,up:120}]},

};
const ENEMY={
  n:{hp:68,sp:44,gold:5,r:10,leak:1,col:'#7bd96a',dk:'#3f8a3a'},

const WAVES=[
  [['n',6,1.2]],

/* ---------- 그림 전용 색 ---------- */
const PAL={bolt:{main:'#3ec6e0',light:'#d2f8ff',dark:'#0f5f75'},blast:{main:'#ff9a3c',light:'#ffe3b8',dark:'#8a4310'},frost:{main:'#9ad8ff',light:'#f2fbff',dark:'#3a7aa8'}};

let G;

function newGame(){
  G={gold:START_GOLD,hp:START_HP,wave:0,active:false,queue:[],clock:0,enemies:[],towers:[],projs:[],parts:[],rings:[],floats:[],
     time:0,state:'play',speed:1,sel:null,build:'bolt',shake:0,nid:1,hover:null,flashBase:0,hintUp:false};

const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d'), ov=$('ov');

/* ---------- 게임 동작 ---------- */
function statOf(t){return TYPES[t.type].lv[t.lv];}
function totalSpent(t){let s=TYPES[t.type].cost;for(let i=1;i<=t.lv;i++)s+=TYPES[t.type].lv[i].up;return s;}
function placeTower(c,r,type){
  if(G.state!=='play')return false;
  if(c<0||r<0||c>=COLS||r>=ROWS||blocked[r][c]||G.towers.some(t=>t.c===c&&t.r===r))return false;
  const cost=TYPES[type].cost; if(G.gold<cost)return false;
  G.gold-=cost;
  const t={type,c,r,x:c*CELL+CELL/2,y:r*CELL+CELL/2,lv:0,cd:.2,ang:-Math.PI/2,rec:0,born:0,show:.9};
  G.towers.push(t); burst(t.x,t.y,TYPES[type].color,10,70); G.rings.push({x:t.x,y:t.y,r:6,gr:90,life:.3,max:.3,col:TYPES[type].color,w:3});
  ui.pickT=0; syncUI(); return t;
}
function canUp(t){return t.lv<2&&G.gold>=TYPES[t.type].lv[t.lv+1].up;}
function upgradeTower(t){
  if(!t||t.lv>=2)return false; const cost=TYPES[t.type].lv[t.lv+1].up; if(G.gold<cost)return false;
  G.gold-=cost; t.lv++; t.show=1; t.born=0;
  burst(t.x,t.y,'#ffe08a',14,90,'star'); G.rings.push({x:t.x,y:t.y,r:8,gr:110,life:.35,max:.35,col:'#ffe08a',w:3});
  float(t.x,t.y-24,'강화!','#ffe08a'); syncUI(); return true;
}
function sellTower(t){
  if(!t)return; const v=Math.floor(totalSpent(t)*.7); G.gold+=v;
  G.towers.splice(G.towers.indexOf(t),1); if(G.sel===t)G.sel=null;
  burst(t.x,t.y,'#cfd8dc',10,70); burst(t.x,t.y,'#9aa5ad',5,30,'smoke'); float(t.x,t.y-14,'+'+v,'#ffd166','coin'); syncUI();
}
function startWave(){
  if(G.state!=='play'||G.active||G.wave>=TOTAL_WAVES)return false;
  G.wave++; G.active=true; G.clock=0; G.queue=[]; let tt=0;
  for(const [type,n,gap] of WAVES[G.wave-1]){ for(let i=0;i<n;i++){G.queue.push({at:tt,type});tt+=gap;} tt+=1.2; }
  syncUI(); return true;
}
function spawn(type){
  const d=ENEMY[type], sc=1+CFG.hpScale*(G.wave-1), hp=Math.round(d.hp*sc);
  G.enemies.push({id:G.nid++,type,hp,max:hp,d:0,x:WP[0][0],y:WP[0][1],ang:0,slowT:0,slowF:0,flash:0,dead:false,ph:Math.random()*6});
}
function dmg(e,v){
  if(e.dead)return; e.hp-=v; e.flash=.1;
  if(e.hp<=0){ e.dead=true; const d=ENEMY[e.type]; G.gold+=d.gold; float(e.x,e.y-10,'+'+d.gold,'#ffd166','coin');
    burst(e.x,e.y,d.col,e.type==='b'?34:12,e.type==='b'?170:100,'goo'); G.rings.push({x:e.x,y:e.y,r:d.r*.6,gr:d.r*3,life:.28,max:.28,col:d.col,w:2});
    if(e.type==='b')G.shake=Math.max(G.shake,.35); syncUI(); }
}
function float(x,y,text,col,icon,big){G.floats.push({x,y,text,col,icon,big,life:big?1.7:.9,max:big?1.7:.9});}
function burst(x,y,col,n,sp,k){ n=Math.max(1,Math.round(n*PF)); for(let i=0;i<n;i++){const a=Math.random()*6.283,v=sp*(.3+Math.random()*.8);G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.35+Math.random()*.25,max:.6,col,r:1.5+Math.random()*2.5,k:k||'spark',rot:Math.random()*6});} }
function findTarget(t,st){
  let best=null,bd=-1;
  for(const e of G.enemies){ if(e.dead)continue; const dx=e.x-t.x,dy=e.y-t.y; if(dx*dx+dy*dy>(st.rng+ENEMY[e.type].r)*(st.rng+ENEMY[e.type].r))continue;
    let score=e.d; if(t.type==='frost'&&e.slowT<=0)score+=100000; if(score>bd){bd=score;best=e;} }
  return best;
}
function fire(t,e,st){
  t.ang=Math.atan2(e.y-t.y,e.x-t.x); t.rec=1;
  const bx=t.x+Math.cos(t.ang)*14, by=t.y+Math.sin(t.ang)*14;
  if(t.type==='bolt')G.projs.push({k:'bolt',x:bx,y:by,tgt:e,tx:e.x,ty:e.y,sp:380,dmg:st.dmg,trail:[]});
  else if(t.type==='blast')G.projs.push({k:'blast',x:bx,y:by,sx:bx,sy:by,tgt:e,tx:e.x,ty:e.y,sp:210,dmg:st.dmg,sprd:st.sp,trail:[],t:0});
  else G.projs.push({k:'frost',x:bx,y:by,tgt:e,tx:e.x,ty:e.y,sp:300,dmg:st.dmg,slow:st.slow,st:st.st,trail:[]});
}
function hitProj(p){
  if(p.k==='bolt'){ if(p.tgt&&!p.tgt.dead)dmg(p.tgt,p.dmg); burst(p.tx,p.ty,'#bff4ff',4,60); }
  else if(p.k==='frost'){ if(p.tgt&&!p.tgt.dead){dmg(p.tgt,p.dmg); applySlow(p.tgt,p.slow,p.st);}
    G.rings.push({x:p.tx,y:p.ty,r:4,gr:60,life:.3,max:.3,col:'#9ad8ff',w:2}); burst(p.tx,p.ty,'#d6f0ff',7,70,'ice'); }
  else { for(const e of G.enemies){ if(e.dead)continue; if(Math.hypot(e.x-p.tx,e.y-p.ty)<=p.sprd+ENEMY[e.type].r*.6)dmg(e,p.dmg); }
    G.rings.push({x:p.tx,y:p.ty,r:6,gr:p.sprd*4,life:.3,max:.3,col:'#ffb347',w:4,fill:true}); burst(p.tx,p.ty,'#ff9a3c',16,150); burst(p.tx,p.ty,'#ffe08a',8,100);
    burst(p.tx,p.ty,'#b8aca0',6,40,'smoke');
    if(!REDUCE)G.shake=Math.max(G.shake,.08); }
}
function applySlow(e,f,t){ const k=e.type==='b'?.5:1; e.slowF=Math.max(e.slowT>0?e.slowF:0,f*k); e.slowT=Math.max(e.slowT,t); }

function update(dt){
  if(G.state!=='play')return;
  G.time+=dt;
  if(G.active){
    G.clock+=dt;
    while(G.queue.length&&G.queue[0].at<=G.clock){spawn(G.queue.shift().type);}
    if(!G.queue.length&&!G.enemies.length){
      G.active=false; const bonus=20+G.wave*CFG.bonus; G.gold+=bonus;
      float(180,230,'파도 클리어 +'+bonus,'#ffd166','coin',true); syncUI();
      if(G.wave>=TOTAL_WAVES){ finish(true); return; }
    }
  }
  if(!G.hintUp){const u=G.towers.find(canUp); if(u){G.hintUp=true; for(let i=0;i<2;i++)G.rings.push({x:u.x,y:u.y,r:10+i*8,gr:70,life:.7+i*.15,max:.7+i*.15,col:'#5ef0b8',w:3});
    float(u.x,u.y-30,'눌러서 강화','#b9ffd9');}}
  // 적
  for(const e of G.enemies){
    const d=ENEMY[e.type]; if(e.slowT>0){e.slowT-=dt; if(e.slowT<=0)e.slowF=0;}
    e.d+=d.sp*(1-e.slowF)*dt; const p=posAt(e.d); e.x=p.x;e.y=p.y;e.ang=p.ang; if(e.flash>0)e.flash-=dt;
    if(!e.dead&&e.d>=pathLen){ e.dead=true; e.leaked=true; G.hp=Math.max(0,G.hp-d.leak); G.flashBase=.4; G.shake=Math.max(G.shake,.25);
      burst(WP[WP.length-1][0],WP[WP.length-1][1],'#ff6b6b',14,110); hudPulse('hp','hit'); syncUI();
      if(G.hp<=0){finish(false);} }
  }
  G.enemies=G.enemies.filter(e=>!e.dead);
  if(G.state!=='play')return;
  // 포탑
  for(const t of G.towers){
    const st=statOf(t); t.cd-=dt; t.born+=dt; if(t.show>0)t.show-=dt; t.rec=Math.max(0,t.rec-dt*6);
    const e=findTarget(t,st);
    if(e){ t.ang=Math.atan2(e.y-t.y,e.x-t.x); if(t.cd<=0){fire(t,e,st);t.cd=st.cd;} }
  }
  // 발사체
  for(const p of G.projs){
    if(p.tgt&&!p.tgt.dead){p.tx=p.tgt.x;p.ty=p.tgt.y;}
    const dx=p.tx-p.x,dy=p.ty-p.y,dist=Math.hypot(dx,dy),step=p.sp*dt;
    p.trail.push([p.x,p.y]); if(p.trail.length>6)p.trail.shift();
    if(p.k==='blast')p.t+=dt;
    if(dist<=step+3){p.done=true;hitProj(p);} else {p.x+=dx/dist*step;p.y+=dy/dist*step;}
  }
  G.projs=G.projs.filter(p=>!p.done);
  fxStep(dt);
}
// 효과만 움직임(게임이 끝난 뒤에도 꽃가루·흔들림이 멈추지 않게)
function fxStep(dt){
  for(const q of G.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.93;q.vy*=.93;q.life-=dt;} G.parts=G.parts.filter(q=>q.life>0);
  for(const q of G.rings){q.r+=q.gr*dt;q.life-=dt;} G.rings=G.rings.filter(q=>q.life>0);
  for(const q of G.floats){q.y-=(q.big?14:26)*dt;q.life-=dt;} G.floats=G.floats.filter(q=>q.life>0);
  if(G.shake>0)G.shake-=dt; if(G.flashBase>0)G.flashBase-=dt;
}
function finish(win){
  G.state=win?'won':'lost'; G.active=false;
  $('ovT').textContent=win?'승리!':'기지가 무너졌어요'; $('ovT').style.fontSize=win?'46px':'28px';
  $('ovP').textContent=win?('체력 '+G.hp+' 남기고 모두 막았어요'):((G.wave)+'파도에서 막혔어요');
  ov.className='show '+(win?'win':'lose'); artT=0;
  if(win&&!REDUCE){for(let i=0;i<70;i++){const cols=['#ffd166','#5ef0b8','#3ec6e0','#ff8fa3','#c9a2ff'];G.parts.push({x:Math.random()*W,y:-10-Math.random()*80,vx:(Math.random()-.5)*40,vy:50+Math.random()*90,life:3,max:3,col:cols[i%5],r:3,k:'conf',rot:Math.random()*6});}}
  syncUI();
}

document.querySelectorAll('.tw').forEach(b=>b.addEventListener('click',()=>{disarmSell();G.build=b.dataset.t;G.sel=null;ui.pickT=3.5;syncUI();}));

let sellArm=null,sellTimer=0;
function disarmSell(){sellArm=null;clearTimeout(sellTimer);const b=$('bSellT');if(b){b.textContent='판매';$('bSell').classList.remove('armed');}}

function hideStart(){ if(!ui.startShown)return; ui.startShown=false;
  if(!REDUCE)document.querySelectorAll('.tw').forEach((b,i)=>{b.style.animationDelay=(.25+i*.13)+'s';b.classList.add('hello');setTimeout(()=>{b.classList.remove('hello');b.style.animationDelay='';},1300);}); const s=$('start'); s.classList.add('hide'); setTimeout(()=>{s.style.display='none';},REDUCE?0:340); }

function cellOf(ev){const r=cv.getBoundingClientRect();return {x:(ev.clientX-r.left)/r.width*W,y:(ev.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',ev=>{
  ev.preventDefault(); if(G.state!=='play')return;
  const p=cellOf(ev),c=Math.floor(p.x/CELL),r=Math.floor(p.y/CELL);
  const t=G.towers.find(t=>t.c===c&&t.r===r);
  if(t){if(G.sel!==t)disarmSell();G.sel=t;t.show=1.2;syncUI();return;}
  if(G.sel){disarmSell();G.sel=null;syncUI();return;}
  if(c<0||r<0||c>=COLS||r>=ROWS)return;
  const fx=c*CELL+CELL/2,fy=r*CELL+CELL/2;

/* =====================================================================
   그리기 — 모든 그림은 캔버스로 직접(외부 그림 없음). 판 바닥은 미리 그려 둠.
   ===================================================================== */
let K=1, bg=null, T=0, artT=0;
function seeded(s){return ()=>{s=(s*16807)%2147483647;return s/2147483647;};}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,TAU);}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function poly(c,n,r,rot){c.beginPath();for(let i=0;i<n;i++){const a=rot+i*TAU/n;c.lineTo(Math.cos(a)*r,Math.sin(a)*r);}c.closePath();}
function starPath(c,x,y,r){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}c.closePath();}
function tracePath(c){c.beginPath();c.moveTo(WP[0][0],WP[0][1]);for(let i=1;i<WP.length;i++)c.lineTo(WP[i][0],WP[i][1]);}

/* ---- 판 바닥: 배양 젤 + 세포 무늬 + 혈관 길 + 장식 ---- */
function drawGroundTo(c){
  let g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,'#174a4b'); g.addColorStop(1,'#0c2a30'); c.fillStyle=g; c.fillRect(0,0,W,H);
  g=c.createRadialGradient(W*.42,H*.38,10,W*.42,H*.38,W*.95); g.addColorStop(0,'rgba(130,240,205,.13)'); g.addColorStop(1,'rgba(130,240,205,0)'); c.fillStyle=g; c.fillRect(0,0,W,H);
  const rnd=seeded(11);
  // 세포 무늬
  for(let i=0;i<64;i++){
    const x=rnd()*W,y=rnd()*H,rx=7+rnd()*16,ry=rx*(.65+rnd()*.35),rot=rnd()*3;
    c.beginPath();c.ellipse(x,y,rx,ry,rot,0,TAU);c.fillStyle='rgba(150,240,215,.035)';c.fill();c.lineWidth=1;c.strokeStyle='rgba(150,240,215,.085)';c.stroke();
    c.beginPath();c.ellipse(x+rx*.15,y-ry*.1,rx*.24,ry*.24,0,0,TAU);c.fillStyle='rgba(150,240,215,.07)';c.fill();
  }
  for(let i=0;i<150;i++){circ(c,rnd()*W,rnd()*H,.5+rnd()*1.1);c.fillStyle='rgba(210,255,240,'+(.04+rnd()*.06)+')';c.fill();}
  // 장식(빈 땅): 규조류·거품·포자

}
function drawResultArt(t){
  const el=$('ovArt'); if(!el.getBoundingClientRect().width)return; const c=fitCanvas(el,320,200); const win=G.state==='won';
  if(win){
    for(let i=0;i<12;i++){const a=i*TAU/12+(REDUCE?0:t*.3);c.save();c.translate(160,108);c.rotate(a);c.beginPath();c.moveTo(0,0);c.lineTo(150,-14);c.lineTo(150,14);c.closePath();c.fillStyle='rgba(255,209,102,'+(i%2?.06:.12)+')';c.fill();c.restore();}
    drawCore(c,160,112,2.4,'happy',t,false);
    c.save();c.translate(160,52+(REDUCE?0:Math.sin(t*3)*2));c.beginPath();c.moveTo(-20,10);c.lineTo(-22,-12);c.lineTo(-10,-2);c.lineTo(0,-18);c.lineTo(10,-2);c.lineTo(22,-12);c.lineTo(20,10);c.closePath();
    const g=c.createLinearGradient(0,-18,0,10);g.addColorStop(0,'#fff2b8');g.addColorStop(1,'#f0a020');c.fillStyle=g;c.fill();c.lineWidth=2;c.strokeStyle='#7a4f00';c.stroke();
    for(const x of[-10,0,10]){circ(c,x,4,2.4);c.fillStyle=x?'#3ec6e0':'#ff5d73';c.fill();}c.restore();
    for(let i=0;i<6;i++){const a=i*TAU/6+t*.8,r=78+Math.sin(t*2+i)*4;starPath(c,160+Math.cos(a)*r,112+Math.sin(a)*r*.55,4+(i%2)*2);c.fillStyle='#ffe08a';c.fill();}
  }else{
    drawCore(c,160,118,2.2,'sad',t,false);
    const b=k=>REDUCE?0:Math.sin(t*4+k)*3;
    drawEnemyTo(c,fakeE('n',72,128+b(0),0,1),t); drawEnemyTo(c,fakeE('f',250,140+b(1),Math.PI,2),t); drawEnemyTo(c,fakeE('b',258,58+b(2),Math.PI*.8,3),t);
  }
}

/* ---------- 크기 ---------- */
function resize(){const r=cv.getBoundingClientRect();const dpr=window.devicePixelRatio||1;K=r.width/W*dpr;cv.width=Math.max(1,Math.round(W*K));cv.height=Math.max(1,Math.round(H*K));bg=null;drawIcons();}
new ResizeObserver(resize).observe(cv); window.addEventListener('resize',resize);

/* ---------- 루프 ---------- */
let last=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  T+=dt*(G.state==='play'?G.speed:1); artT+=dt; if(ui.pickT>0)ui.pickT-=dt;
  let rem=dt*G.speed; while(rem>0){const s=Math.min(rem,1/60);update(s);rem-=s;}
  if(G.state!=='play')fxStep(dt);
  render();
  if(ui.startShown)drawStartArt(artT);
  if(ov.classList.contains('show'))drawResultArt(artT);
  requestAnimationFrame(frame);
}
newGame(); resize(); requestAnimationFrame(frame);

window.__td={CFG,get G(){return G;},update,newGame,placeTower,upgradeTower,sellTower,startWave,blocked,TYPES,ENEMY,WAVES,CELL,COLS,ROWS,nearPath,syncUI,render,hideStart};
})();
</script>
