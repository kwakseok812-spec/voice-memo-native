<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07131d">
<meta name="color-scheme" content="dark">
<title>세균 방어전</title>
<style>
:root{
  --bg:#07131d; --bg2:#0d2230; --panel:#14304a; --panel2:#0e2234; --line:#25496a; --ink:#eef8fb; --dim:#8fb0c2;
  --gold:#ffd166; --bad:#ff6b6b; --mint:#5ef0b8; --acc:#3ec6e0; --pink:#ff7a93;
  --sans:"Pretendard","Noto Sans KR","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;
  --hud:48px; --foot:132px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{background:
  radial-gradient(60% 45% at 50% 38%,rgba(46,140,130,.22),transparent 70%),
  radial-gradient(120% 80% at 50% 0%,#11324a 0%,var(--bg) 62%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
svg{display:block}

/* 바깥 배경: 현미경 시야 속 떠다니는 세포 */
#deco{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#deco i{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(120,230,200,.05) 0 52%,rgba(140,240,215,.16) 58%,rgba(140,240,215,.03) 66%,transparent 70%);
  animation:drift 26s ease-in-out infinite alternate}
#deco i::after{content:"";position:absolute;left:34%;top:30%;width:22%;height:22%;border-radius:50%;background:rgba(150,240,215,.10)}
#deco .lens{border-radius:50%;background:none;border:1px solid rgba(140,240,215,.07);animation:none;box-shadow:0 0 0 18px rgba(140,240,215,.02)}
#deco .lens::after{display:none}
@keyframes drift{from{transform:translate(0,0) rotate(0)}to{transform:translate(30px,-40px) rotate(25deg)}}

#stage{position:fixed;inset:0;z-index:1;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{width:min(100vw, calc((100vh - var(--hud) - var(--foot) - 8px) * .75), 560px);
     width:min(100vw, calc((100dvh - var(--hud) - var(--foot) - 8px) * .75), 560px);position:relative;isolation:isolate}
@media (min-width:640px) and (min-height:620px){
  #app{width:min(100vw, calc((100vh - var(--hud) - var(--foot) - 48px) * .75), 560px);
       width:min(100vw, calc((100dvh - var(--hud) - var(--foot) - 48px) * .75), 560px)}
  #app::before{content:"";position:absolute;inset:-14px -16px -12px;z-index:-1;border-radius:28px;
    background:linear-gradient(180deg,rgba(24,58,84,.85),rgba(9,24,36,.92));
    border:1px solid rgba(140,230,215,.14);box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06)}
}

/* 위 칩 */
#hud{height:var(--hud);display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 6px}
.chip{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 8px;border-radius:999px;min-width:84px;justify-content:center;
  background:linear-gradient(180deg,#1a3a55,#0f2639);border:1px solid rgba(255,255,255,.09);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 3px 8px rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.chip svg{width:20px;height:20px;flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.chip b{font-size:18px;font-weight:900;letter-spacing:-.3px;line-height:1}
.chip.hp b{color:#ffb0b8} .chip.gold b{color:var(--gold)}
.chip.wv .lb{font-size:12px;font-weight:800;color:var(--dim);margin-right:1px}
.chip.wv .of{font-size:13px;font-weight:800;color:var(--dim)}
.chip.bad{animation:bad .35s}
.chip.hit{animation:hit .45s}
@keyframes bad{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes hit{0%{background:linear-gradient(180deg,#c43c4a,#7a1d2a);transform:scale(1.14)}100%{transform:scale(1)}}

#cv{display:block;width:100%;aspect-ratio:3/4;border-radius:16px;background:#0f2c31;
  box-shadow:0 0 0 2px rgba(140,240,215,.16),0 0 0 6px rgba(6,18,28,.9),0 10px 30px rgba(0,0,0,.55);touch-action:none}

/* 아래 단추 */
#foot{height:var(--foot);padding:10px 4px 0;display:flex;flex-direction:column;gap:8px}
#row1{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;height:64px}
.tw{--tc:#3ec6e0;position:relative;border-radius:16px;padding:4px 6px 4px 4px;display:flex;align-items:center;justify-content:center;gap:4px;
  background:linear-gradient(180deg,#1b3a54,#112538);border:2px solid #24476a;box-shadow:0 4px 0 #071420,inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .12s,border-color .15s,box-shadow .15s,opacity .15s}
.tw:active{transform:translateY(3px);box-shadow:0 1px 0 #071420}
.tw canvas{width:44px;height:44px;flex:none;transition:transform .2s}
.tw .tx{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.tw .nm{font-weight:900;font-size:15px;letter-spacing:-.3px;line-height:1.1}
.tw .co{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.tw.on{border-color:var(--tc);background:linear-gradient(180deg,#21486a,#132c44);
  box-shadow:0 4px 0 #071420,0 0 0 3px color-mix(in srgb,var(--tc) 28%,transparent),0 0 18px color-mix(in srgb,var(--tc) 35%,transparent);transform:translateY(-2px)}
.tw.on canvas{transform:scale(1.08) rotate(-4deg)}
.tw.on:active{transform:translateY(2px)}
.tw:not(.on){border-color:color-mix(in srgb,var(--tc) 62%,#24476a);background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 20%,#1b3a54),color-mix(in srgb,var(--tc) 8%,#112538))}
.tw .ds{font-size:10.5px;font-weight:800;color:color-mix(in srgb,var(--tc) 80%,#fff);letter-spacing:-.2px;line-height:1;white-space:nowrap}
.tw.poor .co{color:#ff9a9a}
.tw.hello{animation:hello .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes hello{0%{transform:translateY(0)}40%{transform:translateY(-9px) scale(1.06)}100%{transform:translateY(0)}}
.coin{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 32%,#fff6cf 0 18%,#ffd34d 45%,#c98a12 100%);box-shadow:inset 0 0 0 1.5px #9a650a}

#panel{display:none;grid-template-columns:1.55fr 1fr .62fr;gap:8px;height:64px}
#panel.show{display:grid;animation:rise .2s ease-out}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.pb{border-radius:16px;font-weight:900;font-size:14px;letter-spacing:-.3px;padding:4px 6px;display:flex;align-items:center;justify-content:center;gap:4px;
  background:linear-gradient(180deg,#1b3a54,#112538);border:2px solid #24476a;box-shadow:0 4px 0 #071420,inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .12s,box-shadow .12s,opacity .15s,background .15s}
.pb:active{transform:translateY(3px);box-shadow:0 1px 0 #071420}
.pb canvas{width:38px;height:38px;flex:none}
.pb .tx{display:flex;flex-direction:column;align-items:flex-start;gap:3px;line-height:1.1}
.pb small{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--gold)}
.pb small.nocoin .coin{display:none}
.pb.up{border-color:#3fa874;background:linear-gradient(180deg,#1f5040,#123327)}
.pb.up:not([disabled]){border-color:#8dffc0;background:linear-gradient(180deg,#2b7a58,#17513a);box-shadow:0 4px 0 #071420,0 0 14px rgba(94,240,184,.5),inset 0 1px 0 rgba(255,255,255,.18);animation:upglow 1s ease-in-out infinite alternate}
@keyframes upglow{to{box-shadow:0 4px 0 #071420,0 0 24px rgba(94,240,184,.85),inset 0 1px 0 rgba(255,255,255,.18)}}
.pb.up.max{border-color:#caa64a;background:linear-gradient(180deg,#4a4020,#2c2512)}
.pb small.dl{color:#b9f5d6;font-size:11.5px;white-space:nowrap}
.pb.up #bUpT{white-space:nowrap}
.pb.sell{border-color:#a8574a;background:linear-gradient(180deg,#4c2a26,#2e1816);flex-direction:column;gap:3px}
.pb.sell .tx{align-items:center}
.pb.sell.armed{background:linear-gradient(180deg,#b23b30,#7a221b);border-color:#ff9c8a;color:#fff;animation:arm .5s ease-in-out infinite alternate}
@keyframes arm{to{box-shadow:0 4px 0 #071420,0 0 16px rgba(255,120,100,.6)}}
.pb.close svg{width:22px;height:22px;opacity:.85}
.pb[disabled]{opacity:.42}

#row2{display:grid;grid-template-columns:1fr 84px;gap:8px}
#go{height:50px;border-radius:16px;font-weight:900;font-size:18px;letter-spacing:-.3px;color:#05291b;
  background:linear-gradient(180deg,#7ff7c4 0%,#3bd88f 48%,#25b874 100%);box-shadow:0 4px 0 #157049,inset 0 1px 0 rgba(255,255,255,.6),0 6px 16px rgba(40,200,130,.25);
  transition:transform .1s,box-shadow .1s,filter .15s}
#go:active{transform:translateY(4px);box-shadow:0 0 0 #157049}
#go[disabled]{filter:grayscale(.85) brightness(.6);box-shadow:0 4px 0 #0c2a1e}
#go.pulse:not([disabled]){animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.03);box-shadow:0 4px 0 #157049,inset 0 1px 0 rgba(255,255,255,.6),0 0 26px rgba(94,240,184,.55)}}
#spd{height:50px;border-radius:16px;font-weight:900;font-size:18px;
  background:linear-gradient(180deg,#1b3a54,#112538);border:2px solid #24476a;box-shadow:0 4px 0 #071420;transition:transform .1s,box-shadow .1s,background .15s}
#spd:active{transform:translateY(3px);box-shadow:0 1px 0 #071420}
#spd.fast.fast3{background:linear-gradient(180deg,#7a2f1a,#47160a);border-color:#ff9a5c;color:#ffb078}
#spd.fast{background:linear-gradient(180deg,#6a531a,#3d2f0c);border-color:var(--gold);color:var(--gold)}

/* 승리·패배 */
#ov{position:absolute;left:0;right:0;top:var(--hud);aspect-ratio:3/4;display:none;align-items:center;justify-content:center;border-radius:16px;
  background:radial-gradient(80% 60% at 50% 45%,rgba(10,30,44,.55),rgba(4,10,16,.86))}
#ov.show{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
#ov .box{width:min(86%,330px);text-align:center;padding:14px 18px 20px;border-radius:24px;
  background:linear-gradient(180deg,#183a55,#0c1f30);border:1px solid rgba(140,240,215,.18);box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);
  animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
#ov.lose .box{border-color:rgba(255,120,130,.25)}
@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}
#ovArt{width:100%;aspect-ratio:16/10;display:block}
#ov h1{margin:2px 0 6px;font-size:40px;font-weight:900;letter-spacing:-1px;line-height:1.1}
#ov.win h1{background:linear-gradient(180deg,#fff2b8,#ffd166 55%,#f0a020);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
#ov.lose h1{color:#ffa3ab}
#ov p{margin:0 0 16px;color:var(--dim);font-size:15px;font-weight:700}
.bigbtn{height:56px;padding:0 40px;border-radius:18px;font-weight:900;font-size:20px;letter-spacing:-.3px;color:#05291b;
  background:linear-gradient(180deg,#7ff7c4 0%,#3bd88f 48%,#25b874 100%);box-shadow:0 5px 0 #157049,inset 0 1px 0 rgba(255,255,255,.6),0 8px 22px rgba(40,200,130,.3);
  transition:transform .1s,box-shadow .1s}
.bigbtn:active{transform:translateY(5px);box-shadow:0 0 0 #157049}

/* 시작 화면 */
#start{position:absolute;inset:-2px -2px -16px;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:18px;
  background:radial-gradient(70% 50% at 50% 40%,rgba(30,90,95,.55),transparent 75%),linear-gradient(180deg,#0b2233,#07131d)}
#start.hide{animation:out .35s ease-in forwards}
@keyframes out{to{opacity:0;transform:scale(1.04)}}
#startArt{width:min(92%,380px);aspect-ratio:16/10;display:block}
#start h1{margin:4px 0 0;font-size:clamp(40px,12vw,58px);font-weight:900;letter-spacing:-2px;line-height:1;
  background:linear-gradient(180deg,#f2fffb 0%,#8ff5d0 45%,#2fc59a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #0a3a30) drop-shadow(0 8px 18px rgba(60,240,180,.25))}
#start .tag{font-size:12px;font-weight:800;letter-spacing:6px;color:#6fb9a8;margin:8px 0 26px;padding-left:6px}
#startBtn{animation:pulse2 1.3s ease-in-out infinite}
@keyframes pulse2{50%{transform:scale(1.05)}}

/* ---- 2탄 확장: 새 포탑 표시·판 고르기·확인 상자·결과 별 ---- */
.tw .new{position:absolute;top:-12px;right:6px;padding:2px 6px;border-radius:9px;font-size:10px;font-weight:900;letter-spacing:.3px;color:#2b1a00;
  background:linear-gradient(180deg,#ffe58a,#ffb830);box-shadow:0 2px 0 #7a4a00,0 0 10px rgba(255,200,80,.6);animation:newb .8s ease-in-out infinite alternate;pointer-events:none;display:none}
@keyframes newb{to{transform:translateY(-2px) scale(1.1)}}
#row1.n4{gap:6px}
#row1.n4 .tw{min-width:0}
#row1.n4 .tw{padding:3px 4px 3px 3px;gap:2px}
#row1.n4 .tw canvas{width:34px;height:34px}
#row1.n4 .tw .nm{font-size:14px}
#row1.n4 .tw .co{font-size:12px;gap:3px}
#row1.n4 .tw .ds{font-size:10px}
#row1.n4 .tw .coin{width:10px;height:10px}
#row1.n5{gap:4px}
#row1.n5 .tw{min-width:0;padding:2px 1px;flex-direction:column;gap:0}
#row1.n5 .tw canvas{width:28px;height:28px}
#row1.n5 .tw .tx{align-items:center;gap:1px}
#row1.n5 .tw .nm{font-size:13px;letter-spacing:-.5px}
#row1.n5 .tw .ds{display:none}
#row1.n5 .tw .co{font-size:12px;gap:3px}
#row1.n5 .tw .coin{width:10px;height:10px}
@media (max-width:350px){#row1.n5 .tw canvas{width:26px;height:26px}#row1.n5 .tw .nm{font-size:12px}#row1.n5 .tw .co{font-size:11px;gap:2px}}
@media (max-width:350px){#row1.n4{gap:4px}#row1.n4 .tw{padding:3px 2px 3px 2px;gap:1px}#row1.n4 .tw canvas{width:29px;height:29px}#row1.n4 .tw .nm{font-size:13px}#row1.n4 .tw .co{font-size:11px;gap:2px}#row1.n4 .tw .ds{font-size:9.5px}}
#row2.h{grid-template-columns:48px 1fr 84px}
#home{display:none;height:50px;border-radius:16px;align-items:center;justify-content:center;background:linear-gradient(180deg,#1b3a54,#112538);border:2px solid #24476a;box-shadow:0 4px 0 #071420;transition:transform .1s,box-shadow .1s}
#row2.h #home{display:flex}
#home:active{transform:translateY(3px);box-shadow:0 1px 0 #071420}
#home svg{width:22px;height:22px}
.rb{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.rb.multi .bigbtn{height:48px;padding:0 14px;font-size:17px;flex:1 1 40%}
.rb.multi .nx{flex:1 1 100%}
.bigbtn.sec{color:#d6ecf7;background:linear-gradient(180deg,#2a5878,#173a55);box-shadow:0 5px 0 #0b2233,inset 0 1px 0 rgba(255,255,255,.18)}
.bigbtn.sec:active{box-shadow:0 0 0 #0b2233}
#stars{display:flex;justify-content:center;gap:8px;margin:0 0 4px;height:42px}
#stars:empty{display:none}
#stars span{font-size:36px;line-height:42px;color:#34506a;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#stars span.on{color:#ffd84d;text-shadow:0 2px 0 #8a5a00,0 0 14px rgba(255,210,80,.6);animation:starpop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
#recBadge{display:none;margin:0 auto 10px;padding:3px 12px;border-radius:999px;font-size:13px;font-weight:900;color:#2b1a00;background:linear-gradient(180deg,#ffe58a,#ffb830);width:max-content}
#recBadge.show{display:block;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
#ov.st #ovArt{aspect-ratio:16/7.5}
#ov.st p{margin-bottom:8px}
#sel{position:absolute;inset:-2px -2px -16px;z-index:4;display:none;flex-direction:column;align-items:center;gap:12px;padding:18px 14px 12px;border-radius:18px;
  background:radial-gradient(70% 50% at 50% 30%,rgba(30,90,95,.5),transparent 75%),linear-gradient(180deg,#0b2233,#07131d);overflow:hidden}
#sel.show{display:flex}
#sel h2{margin:2px 0 0;font-size:28px;font-weight:900;letter-spacing:-.8px;background:linear-gradient(180deg,#f2fffb,#8ff5d0 60%,#2fc59a);-webkit-background-clip:text;background-clip:text;color:transparent}
#resume{display:none;width:100%;height:54px;border-radius:16px;font-weight:900;font-size:17px;color:#05291b;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#7ff7c4,#3bd88f 48%,#25b874);box-shadow:0 4px 0 #157049,inset 0 1px 0 rgba(255,255,255,.6);animation:pulse2 1.4s ease-in-out infinite}
#resume.show{display:flex}
#resume:active{transform:translateY(4px);box-shadow:0 0 0 #157049;animation:none}
.cards{width:100%;display:flex;flex-direction:column;gap:9px}
.card{width:100%;height:72px;flex:none;border-radius:18px;padding:6px 12px 6px 8px;display:flex;align-items:center;gap:12px;text-align:left;
  background:linear-gradient(180deg,#1d4262,#112a40);border:2px solid #2a557a;box-shadow:0 5px 0 #071420,inset 0 1px 0 rgba(255,255,255,.09);
  transition:transform .12s,box-shadow .12s;animation:cardin .26s cubic-bezier(.2,1.2,.4,1) both;animation-delay:calc(var(--i)*60ms)}
.card:active:not(.locked){transform:translateY(4px) scale(.99);box-shadow:0 1px 0 #071420}
@keyframes cardin{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.card canvas{width:48px;height:60px;flex:none;border-radius:9px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.card .ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.card .ct b{font-size:24px;font-weight:900;letter-spacing:-.6px;line-height:1}
.card .ct i{font-style:normal;font-size:13px;font-weight:800;color:var(--dim)}
.card .st{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:84px}
.card .stars{font-size:22px;letter-spacing:2px;line-height:1;color:#34506a}
.card .stars u{text-decoration:none;color:#ffd84d;text-shadow:0 0 8px rgba(255,210,80,.5)}
.card .st small{font-size:12px;font-weight:800;color:var(--dim);white-space:nowrap}
.card .lk{width:26px;height:26px}
.card.locked{filter:grayscale(.75) brightness(.62);box-shadow:0 3px 0 #071420}
.card.pop{animation:unl .8s ease-out}
@keyframes unl{0%{box-shadow:0 5px 0 #071420,0 0 0 0 rgba(255,220,120,.95)}100%{box-shadow:0 5px 0 #071420,0 0 0 24px rgba(255,220,120,0)}}
.card.nope{animation:bad .35s}
#selNote{margin-top:auto;min-height:16px;font-size:12px;font-weight:800;color:#ffb0a0;text-align:center}
#dlg{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(3,9,14,.72);border-radius:16px}
#dlg.show{display:flex;animation:fade .2s}
#dlg .box{width:min(86%,310px);padding:20px 16px 16px;text-align:center;border-radius:22px;background:linear-gradient(180deg,#183a55,#0c1f30);
  border:1px solid rgba(140,240,215,.2);box-shadow:0 20px 50px rgba(0,0,0,.6);animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
#dlg p{margin:0 0 4px;font-size:18px;font-weight:900;line-height:1.3}
#dlg small{display:block;margin:0 0 14px;font-size:13px;font-weight:700;color:var(--dim);min-height:17px}
#dlg .row{display:flex;gap:8px}
#dlg .row button{flex:1;height:50px;padding:0;border-radius:14px;font-weight:900;font-size:16px}

    G.rings.push({x:p.tx,y:p.ty,r:6,gr:p.sprd*4,life:.3,max:.3,col:'#ffb347',w:4,fill:true}); burst(p.tx,p.ty,'#ff9a3c',16,150); burst(p.tx,p.ty,'#ffe08a',8,100);
    burst(p.tx,p.ty,'#b8aca0',6,40,'smoke');
    if(!REDUCE)G.shake=Math.max(G.shake,.08); }
}
function applySlow(e,f,t){ const k=e.type==='b'?.5:(ENEMY[e.type].slowResist!==undefined?ENEMY[e.type].slowResist:1); e.slowF=Math.max(e.slowT>0?e.slowF:0,f*k); e.slowT=Math.max(e.slowT,t); }

/* 치유: 모든 치유가 같은 박자(1.6초)로 한 번에 — 한 적은 그 박자에 가장 센 치유 하나로부터만 회복, 치유 적끼리는 서로 고치지 않음 */
function healTick(dt){
  G.healT-=dt; if(G.healT>0)return; G.healT=1.6;
  const hs=G.enemies.filter(e=>!e.dead&&ENEMY[e.type].heal); if(!hs.length)return;
  for(const h of hs)G.rings.push({x:h.x,y:h.y,r:6,gr:ENEMY[h.type].heal.rad*3,life:.4,max:.4,col:'#7de08a',w:2});
  for(const o of G.enemies){
    if(o.dead||ENEMY[o.type].heal||o.hp>=o.max)continue;
    let best=0; for(const h of hs){const H=ENEMY[h.type].heal; if(H.pct>best&&Math.hypot(h.x-o.x,h.y-o.y)<=H.rad)best=H.pct;}
    if(best>0){o.hp=Math.min(o.max,o.hp+o.max*best); burst(o.x,o.y-6,'#8dffb0',1,30,'plus');}
  }
}
function update(dt){
  if(G.state!=='play'||ui.dlg)return;
  G.time+=dt;
  if(G.active){
    G.clock+=dt;
    while(G.queue.length&&G.queue[0].at<=G.clock){const q=G.queue.shift();spawn(q.type,q.lane);}
    if(!G.queue.length&&!G.enemies.length){
      G.active=false; const bonus=20+G.wave*CFG.bonus; G.gold+=bonus;
      float(180,230,'파도 클리어 +'+bonus,'#ffd166','coin',true); syncUI();
      if(G.wave>=TOTAL_WAVES){ finish(true); return; }
      saveMid();
    }
  }
  if(!G.hintUp){const u=G.towers.find(canUp); if(u){G.hintUp=true; for(let i=0;i<2;i++)G.rings.push({x:u.x,y:u.y,r:10+i*8,gr:70,life:.7+i*.15,max:.7+i*.15,col:'#5ef0b8',w:3});
    float(u.x,u.y-30,'눌러서 강화','#b9ffd9');}}
  // 적
  for(const e of G.enemies){
    const d=ENEMY[e.type]; if(e.slowT>0){e.slowT-=dt; if(e.slowT<=0)e.slowF=0;}
    if(e.pz){ e.pz.t-=dt; if(!e.dead)dmg(e,e.pz.dps*dt,'p'); if(!REDUCE&&!e.dead&&vr()<dt*5)burst(e.x,e.y-3,'#cfa6ff',1,26,'drop'); if(e.pz.t<=0)e.pz=null; }
    if(d.blink&&!e.dead){ e.bt=(e.bt===undefined?d.blink.every*(.45+(e.id%4)*.18):e.bt)-dt;   // 순간이동: 길을 따라 앞으로 튐(끝 40 앞에서는 안 튐)
      if(e.bt<=0){ e.bt=d.blink.every; if(e.d+d.blink.dist<M.routes[e.rt].len-40){ e.gx=e.x;e.gy=e.y;e.blinkFx=.35; G.rings.push({x:e.x,y:e.y,r:d.r*.5,gr:d.r*4,life:.3,max:.3,col:d.col,w:2}); burst(e.x,e.y,d.col,6,90); e.d+=d.blink.dist; } } }
    if(e.blinkFx>0)e.blinkFx-=dt;
    if(d.spawn&&!e.dead){ e.st=(e.st===undefined?d.spawn.every*.5:e.st)-dt;   // 산란: 일정 간격으로 작은 적을 낳음(돈 없음)
      if(e.st<=0){ e.st=d.spawn.every; const sc=scaleOf(); G.extra+=d.spawn.n;
        for(let i=0;i<d.spawn.n;i++){ const m=mkEnemy(d.spawn.type,e.rt,Math.max(0,e.d-8-i*10),Math.round(ENEMY[d.spawn.type].hp*sc*.8)); m.nogold=true; }
        G.rings.push({x:e.x,y:e.y,r:d.r*.6,gr:d.r*3.2,life:.35,max:.35,col:d.col,w:3}); burst(e.x,e.y,'#ffd8cf',8,100); } }
    e.d+=d.sp*(1-e.slowF)*dt; const p=posAt(M.routes[e.rt],e.d); e.x=p.x;e.y=p.y;e.ang=p.ang; if(e.flash>0)e.flash-=dt;
    if(!e.dead&&e.d>=M.routes[e.rt].len){ e.dead=true; e.leaked=true; G.hp=Math.max(0,G.hp-d.leak); G.flashBase=.4; G.shake=Math.max(G.shake,.25);
      burst(M.base[0],M.base[1],'#ff6b6b',14,110); hudPulse('hp','hit'); syncUI();
      if(G.hp<=0){finish(false);} }
  }
  G.enemies=G.enemies.filter(e=>!e.dead);
  if(G.state!=='play')return;
  healTick(dt);
  // 응원: 사거리 안 포탑의 힘 올림(가장 센 것 하나만)
  { const bs=G.towers.filter(b=>TYPES[b.type].noAtk); for(const t of G.towers){ t.bf=0; if(!bs.length||TYPES[t.type].noAtk)continue;
      for(const b of bs){ const r=statOf(b); if(r.buff>t.bf&&Math.hypot(b.x-t.x,b.y-t.y)<=r.rng)t.bf=r.buff; } } }
  // 포탑
  for(const t of G.towers){
    const st=statOf(t); t.cd-=dt; t.born+=dt; if(t.show>0)t.show-=dt; t.rec=Math.max(0,t.rec-dt*6);
    if(st.buff!==undefined)continue;
    const e=findTarget(t,st);
    if(e){ t.ang=Math.atan2(e.y-t.y,e.x-t.x); if(t.cd<=0){fire(t,e,st);t.cd=st.cd;} }
  }
  // 발사체
  for(const p of G.projs){
    if(p.tgt&&!p.tgt.dead){p.tx=p.tgt.x;p.ty=p.tgt.y;}
    const dx=p.tx-p.x,dy=p.ty-p.y,dist=Math.hypot(dx,dy),step=p.sp*dt;
    p.trail.push([p.x,p.y]); if(p.trail.length>6)p.trail.shift();
    if(p.k==='blast')p.t+=dt;
    if(dist<=step+3){p.done=true;hitProj(p);} else {p.x+=dx/dist*step;p.y+=dy/dist*step;}
  }
  G.projs=G.projs.filter(p=>!p.done);
  fxStep(dt);
}
// 효과만 움직임(게임이 끝난 뒤에도 꽃가루·흔들림이 멈추지 않게)
function fxStep(dt){
  for(const q of G.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.93;q.vy*=.93;q.life-=dt;} G.parts=G.parts.filter(q=>q.life>0);
  for(const q of G.rings){q.r+=q.gr*dt;q.life-=dt;} G.rings=G.rings.filter(q=>q.life>0);
  for(const q of G.floats){q.y-=(q.big?14:26)*dt;q.life-=dt;} G.floats=G.floats.filter(q=>q.life>0);
  for(const q of G.arcs)q.life-=dt; G.arcs=G.arcs.filter(q=>q.life>0);
  if(G.shake>0)G.shake-=dt; if(G.flashBase>0)G.flashBase-=dt;
}

  syncUI();

  const s=STAGES.find(x=>x.id===o.stage); if(!s||s.soon||!stageOpen(s.id)||o.sv!==s.ver)return null;   // 숫자를 바꾼 뒤의 옛 기록은 버림(ver)

let K=1, bg=null, T=0, artT=0;
function seeded(s){return ()=>{s=(s*16807)%2147483647;return s/2147483647;};}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,TAU);}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

function tracePath(c){c.beginPath();for(const R of M.routes){c.moveTo(R.wp[0][0],R.wp[0][1]);for(let i=1;i<R.wp.length;i++)c.lineTo(R.wp[i][0],R.wp[i][1]);}}

/* ---- 판 바닥: 배양 젤 + 세포 무늬 + 혈관 길 + 장식 ---- */
function drawGroundTo(c){
  const TH=M.th;
  let g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,TH.g0); g.addColorStop(1,TH.g1); c.fillStyle=g; c.fillRect(0,0,W,H);
  g=c.createRadialGradient(W*.42,H*.38,10,W*.42,H*.38,W*.95); g.addColorStop(0,TH.glow); g.addColorStop(1,TH.glow0); c.fillStyle=g; c.fillRect(0,0,W,H);
  const rnd=seeded(11);
  // 세포 무늬
  for(let i=0;i<64;i++){
    const x=rnd()*W,y=rnd()*H,rx=7+rnd()*16,ry=rx*(.65+rnd()*.35),rot=rnd()*3;
    c.beginPath();c.ellipse(x,y,rx,ry,rot,0,TAU);c.fillStyle='rgba('+TH.cell+',.035)';c.fill();c.lineWidth=1;c.strokeStyle='rgba('+TH.cell+',.085)';c.stroke();
    c.beginPath();c.ellipse(x+rx*.15,y-ry*.1,rx*.24,ry*.24,0,0,TAU);c.fillStyle='rgba('+TH.cell+',.07)';c.fill();
  }
  for(let i=0;i<150;i++){circ(c,rnd()*W,rnd()*H,.5+rnd()*1.1);c.fillStyle='rgba(210,255,240,'+(.04+rnd()*.06)+')';c.fill();}
  // 장식(빈 땅): 규조류·거품·포자
  const free=[]; for(let r=0;r<ROWS;r++)for(let cc=0;cc<COLS;cc++) if(!blocked[r][cc]) free.push([cc,r]);
  for(let i=0;i<16;i++){
    const [cc,r]=free[Math.floor(rnd()*free.length)], x=cc*CELL+8+rnd()*24, y=r*CELL+8+rnd()*24, k=i%4;
    c.save();c.translate(x,y);c.rotate(rnd()*3);
    if(k===0){ // 규조류
      c.beginPath();c.ellipse(0,0,9,3.6,0,0,TAU);c.fillStyle='rgba(205,240,150,.13)';c.fill();c.strokeStyle='rgba(205,240,150,.32)';c.lineWidth=1;c.stroke();

    }else if(k===2){ // 포자
      circ(c,0,0,4.2);c.fillStyle='rgba(255,205,150,.16)';c.fill();c.strokeStyle='rgba(255,205,150,.32)';c.lineWidth=1;c.stroke();
      for(let j=0;j<8;j++){const a=j*TAU/8;circ(c,Math.cos(a)*6,Math.sin(a)*6,.8);c.fillStyle='rgba(255,205,150,.3)';c.fill();}
    }else{ // 작은 고리 세포
      circ(c,0,0,5.5);c.strokeStyle='rgba(170,200,255,.26)';c.lineWidth=1.4;c.stroke();circ(c,1,-1,1.8);c.fillStyle='rgba(170,200,255,.25)';c.fill();
    }
    c.restore();
  }
  // 혈관 길
  c.lineJoin='round';c.lineCap='round';
  c.save();c.translate(0,4);tracePath(c);c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=42;c.stroke();c.restore();
  tracePath(c);c.strokeStyle=TH.vein[0];c.lineWidth=40;c.stroke();
  tracePath(c);c.strokeStyle=TH.vein[1];c.lineWidth=36;c.stroke();
  tracePath(c);c.setLineDash([2.5,8]);c.strokeStyle=TH.dash;c.lineWidth=36;c.stroke();c.setLineDash([]);
  tracePath(c);c.strokeStyle=TH.vein[2];c.lineWidth=28;c.stroke();
  tracePath(c);c.strokeStyle=TH.vein[3];c.lineWidth=26;c.stroke();
  tracePath(c);c.strokeStyle=TH.vein[4];c.lineWidth=17;c.stroke();

  // 입구 쪽 화살표
  c.strokeStyle=TH.arrow;c.lineWidth=2.6;
  for(const en of M.ent)for(const x0 of [26,40]){const x=en.f?W-x0:x0,s=en.f?-1:1;c.beginPath();c.moveTo(x-3*s,en.y-7);c.lineTo(x+3*s,en.y);c.lineTo(x-3*s,en.y+7);c.stroke();}
  if(S&&S.shortcut){c.strokeStyle='rgba(255,236,150,.55)';c.lineWidth=3;c.lineCap='round';c.lineJoin='round';for(const [sx,sy] of S.shortcut){c.beginPath();c.moveTo(sx-6,sy-4);c.lineTo(sx,sy+3);c.lineTo(sx+6,sy-4);c.stroke();}}

  g=c.createRadialGradient(W/2,H/2,H*.32,W/2,H/2,H*.78); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,8,14,.55)'); c.fillStyle=g; c.fillRect(0,0,W,H);

const portalPts=(()=>{const r=seeded(5),a=[];for(let i=0;i<20;i++){const t=i*TAU/20;a.push([Math.cos(t)*(10+r()*3.5),Math.sin(t)*(21+r()*4)]);}return a;})();
function drawPortal(c,t,px,py,flip){

  const pul=REDUCE?1:1+Math.sin(t*3)*.08;

    let n=0; for(const o of G.towers){ if(!TYPES[o.type].noAtk&&Math.hypot(o.x-x,o.y-y)<=rg){n++;c.save();c.strokeStyle='rgba(255,215,90,.95)';c.lineWidth=3;circ(c,o.x,o.y,21);c.stroke();c.setLineDash([4,4]);c.lineWidth=2;c.beginPath();c.moveTo(x,y);c.lineTo(o.x,o.y);c.stroke();c.restore();} }
    drawTowerTo(c,{type:pc.type,x,y,lv:0,ang:-Math.PI/2,rec:0,born:1},T,.6);
    const lab=n?'한 번 더 누르면 설치 · 힘 받는 포탑 '+n:'한 번 더 누르면 설치 · 닿는 포탑 없음'; c.save();c.font='900 12px '+FONT;c.textAlign='center';c.textBaseline='middle';
    const lw=c.measureText(lab).width+18, lx=Math.min(W-lw/2-4,Math.max(lw/2+4,x)), ly=y>H-60?y-34:y+34; rr(c,lx-lw/2,ly-11,lw,22,11);c.fillStyle='rgba(8,22,32,.88)';c.fill();c.lineWidth=1.5;c.strokeStyle=n?'#ffd35e':'#9fb4c4';c.stroke();c.fillStyle=n?'#ffe7a3':'#cfe0ec';c.fillText(lab,lx,ly+.5);c.restore(); } }
  const es=G.enemies.slice().sort((a,b)=>a.y-b.y); for(const e of es)drawEnemyTo(c,e,T);
  for(const p of G.projs)drawProj(c,p,T);
  for(const a of G.arcs){ const f=a.life/a.max; c.save();c.globalCompositeOperation='lighter';c.lineCap='round';c.lineJoin='round';c.globalAlpha=Math.min(1,f*1.5);
    if(a.k==='snipe'){c.beginPath();c.moveTo(a.x1,a.y1);c.lineTo(a.x2,a.y2);c.strokeStyle='rgba(255,107,138,.6)';c.lineWidth=2+7*f;c.stroke();c.strokeStyle='#fff3f6';c.lineWidth=1.8;c.stroke();
      const g=c.createRadialGradient(a.x2,a.y2,0,a.x2,a.y2,14);g.addColorStop(0,'rgba(255,230,238,.9)');g.addColorStop(1,'rgba(255,107,138,0)');c.fillStyle=g;circ(c,a.x2,a.y2,14);c.fill();}
    else{zig(c,a.pts,T,2.6);c.strokeStyle='rgba(125,255,106,.6)';c.lineWidth=5;c.stroke();c.strokeStyle='#f2ffe9';c.lineWidth=1.6;c.stroke();}
    c.restore(); }
  for(const q of G.rings){const a=q.life/q.max;c.globalAlpha=a;c.strokeStyle=q.col;c.lineWidth=q.w;circ(c,q.x,q.y,q.r);
    if(q.fill){c.save();c.globalCompositeOperation='lighter';c.globalAlpha=a*.4;const g=c.createRadialGradient(q.x,q.y,0,q.x,q.y,q.r);g.addColorStop(0,'#fff3c0');g.addColorStop(1,q.col);c.fillStyle=g;c.fill();c.restore();c.globalAlpha=a;}
    c.stroke();}
  c.globalAlpha=1;
  drawParts(c); drawFloats(c);
  if(G.active){const tot=WAVES[G.wave-1].reduce((s,g)=>s+g[1],0)+(G.extra||0),left=G.queue.length+G.enemies.length,f=Math.max(0,1-left/tot);
    rr(c,12,8,W-24,6,3);c.fillStyle='rgba(0,0,0,.45)';c.fill();
    if(f>0){rr(c,12,8,Math.max(6,(W-24)*f),6,3);const g=c.createLinearGradient(12,0,W-12,0);g.addColorStop(0,'#5ef0b8');g.addColorStop(1,'#3ec6e0');c.fillStyle=g;c.fill();}}
  if(G.flashBase>0){const a=Math.min(1,G.flashBase/.4);const g=c.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.75);g.addColorStop(0,'rgba(255,40,60,0)');g.addColorStop(1,'rgba(255,40,60,'+(.4*a)+')');c.fillStyle=g;c.fillRect(-20,-20,W+40,H+40);}
  c.restore();
}

/* ---- 단추 아이콘·시작/결과 그림 ---- */
function fitCanvas(el,w,h){const d=window.devicePixelRatio||1,r=el.getBoundingClientRect(),cw=Math.max(1,Math.round((r.width||w)*d)),ch=Math.max(1,Math.round((r.height||h)*d));
  if(el.width!==cw||el.height!==ch){el.width=cw;el.height=ch;} const c=el.getContext('2d');c.setTransform(cw/w,0,0,ch/h,0,0);c.clearRect(0,0,w,h);return c;}
function drawIcon(el,type,lv){const c=fitCanvas(el,44,44);drawTowerTo(c,{type,x:22,y:21,lv,ang:-Math.PI/4,rec:0,born:1},.6);}
function drawIcons(){document.querySelectorAll('.tw').forEach(b=>drawIcon(b.querySelector('canvas'),b.dataset.t,0)); upIconKey=''; if(G&&G.sel)syncUI();}
const fakeE=(type,x,y,ang,ph,extra)=>Object.assign({type,x,y,ang,ph,slowT:0,flash:0,hp:1,max:1},extra||{});
function drawStartArt(t){
  const el=$('startArt'); if(!el.getBoundingClientRect().width)return; const c=fitCanvas(el,320,200);
  c.lineJoin='round';c.lineCap='round';
  const curve=()=>{c.beginPath();c.moveTo(-10,150);c.bezierCurveTo(80,170,140,60,330,90);};
  curve();c.strokeStyle='#3a1222';c.lineWidth=36;c.stroke();curve();c.strokeStyle='#7d2b45';c.lineWidth=32;c.stroke();
  curve();c.strokeStyle='#e88d9c';c.lineWidth=24;c.stroke();curve();c.strokeStyle='#b9465f';c.lineWidth=22;c.stroke();curve();c.strokeStyle='#c95870';c.lineWidth=14;c.stroke();
  const bob=k=>REDUCE?0:Math.sin(t*3+k)*2;
  drawEnemyTo(c,fakeE('b',268,92+bob(0),Math.PI,1),t);
  drawEnemyTo(c,fakeE('t',210,104+bob(1),Math.PI,2),t);
  drawEnemyTo(c,fakeE('f',160,128+bob(2),Math.PI*.9,3,{slowT:1}),t);
  drawEnemyTo(c,fakeE('n',112,148+bob(3),Math.PI*.95,4),t);
  const shoot=(t*1.4)%1;
  drawTowerTo(c,{type:'bolt',x:120,y:62,lv:2,ang:Math.atan2(128-62,160-120),rec:shoot<.15?1-shoot/.15:0,born:1},t);
  drawTowerTo(c,{type:'frost',x:212,y:160,lv:1,ang:0,rec:0,born:1},t);
  drawTowerTo(c,{type:'blast',x:58,y:96,lv:1,ang:Math.atan2(148-96,112-58),rec:0,born:1},t);
  if(!REDUCE){const u=shoot;const x=120+(160-120)*u,y=62+(128-62)*u;c.save();c.globalCompositeOperation='lighter';c.beginPath();c.moveTo(x-8*(40/78),y-8*(66/78));c.lineTo(x,y);
    c.strokeStyle='rgba(62,198,224,.6)';c.lineWidth=4;c.stroke();c.strokeStyle='#e6fcff';c.lineWidth=1.5;c.stroke();c.restore();}
  drawCore(c,26,168,1,'ok',t,false);
}
function drawResultArt(t){
  const el=$('ovArt'); if(!el.getBoundingClientRect().width)return; const c=fitCanvas(el,320,200); const win=G.state==='won';
  if(win){
    for(let i=0;i<12;i++){const a=i*TAU/12+(REDUCE?0:t*.3);c.save();c.translate(160,108);c.rotate(a);c.beginPath();c.moveTo(0,0);c.lineTo(150,-14);c.lineTo(150,14);c.closePath();c.fillStyle='rgba(255,209,102,'+(i%2?.06:.12)+')';c.fill();c.restore();}
    drawCore(c,160,112,2.4,'happy',t,false);
    c.save();c.translate(160,52+(REDUCE?0:Math.sin(t*3)*2));c.beginPath();c.moveTo(-20,10);c.lineTo(-22,-12);c.lineTo(-10,-2);c.lineTo(0,-18);c.lineTo(10,-2);c.lineTo(22,-12);c.lineTo(20,10);c.closePath();
    const g=c.createLinearGradient(0,-18,0,10);g.addColorStop(0,'#fff2b8');g.addColorStop(1,'#f0a020');c.fillStyle=g;c.fill();c.lineWidth=2;c.strokeStyle='#7a4f00';c.stroke();
    for(const x of[-10,0,10]){circ(c,x,4,2.4);c.fillStyle=x?'#3ec6e0':'#ff5d73';c.fill();}c.restore();
    for(let i=0;i<6;i++){const a=i*TAU/6+t*.8,r=78+Math.sin(t*2+i)*4;starPath(c,160+Math.cos(a)*r,112+Math.sin(a)*r*.55,4+(i%2)*2);c.fillStyle='#ffe08a';c.fill();}
  }else{
    drawCore(c,160,118,2.2,'sad',t,false);
    const b=k=>REDUCE?0:Math.sin(t*4+k)*3;
    drawEnemyTo(c,fakeE('n',72,128+b(0),0,1),t); drawEnemyTo(c,fakeE('f',250,140+b(1),Math.PI,2),t); drawEnemyTo(c,fakeE('b',258,58+b(2),Math.PI*.8,3),t);
  }
}

/* ---------- 크기 ---------- */
function resize(){const r=cv.getBoundingClientRect();const dpr=window.devicePixelRatio||1;K=r.width/W*dpr;cv.width=Math.max(1,Math.round(W*K));cv.height=Math.max(1,Math.round(H*K));bg=null;drawIcons();}
new ResizeObserver(resize).observe(cv); window.addEventListener('resize',resize);

/* ---------- 루프 ---------- */
let last=0;
function advance(dt){let rem=dt*G.speed; while(rem>0){const s=Math.min(rem,1/60);update(s);rem-=s;}}
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  T+=dt*(G.state==='play'?G.speed:1); artT+=dt; if(ui.pickT>0)ui.pickT-=dt;
  advance(dt);
  if(G.state!=='play')fxStep(dt);
  render();
  if(ui.startShown)drawStartArt(artT);
  if(ov.classList.contains('show'))drawResultArt(artT);
  if(tipKind)drawTip(T);
  requestAnimationFrame(frame);
}
loadSave(); loadStage(1); resize(); requestAnimationFrame(frame);

window.__td={CFG,get G(){return G;},update,newGame,placeTower,upgradeTower,sellTower,startWave,get blocked(){return blocked;},TYPES,ENEMY,get WAVES(){return WAVES;},CELL,COLS,ROWS,nearPath,syncUI,render,hideStart,
  loadStage,STAGES,mem,ui,get S(){return S;},get M(){return M;},setVR(f){VR=f;},showSel,enterStage,readMid,saveMid,stageOpen,finish,mkEnemy,dmg,spawn,openDlg,closeDlg,showIntro,laneUse,advance,healTick,statOf,applySlow,afterDeath};
})();
