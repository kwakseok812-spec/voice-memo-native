<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1c1611">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="지뢰 피하기">
<meta name="description" content="지뢰를 피해 판을 모두 여는 퍼즐. 난이도 3단계.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>지뢰 피하기</title>
<style>
:root{
  --bg:#1c1611; --bg2:#2a2019; --panel:#33271d; --line:#4a3a2b; --ink:#f3e9d8; --dim:#b9a88f; --gold:#e3b04b;
  --wood1:#ecd29c; --wood2:#d3a862; --wood3:#a97d3e; --red:#d8392c;
  --sans:"Pretendard","Noto Sans KR","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;
  --serif:"Noto Serif KR","Noto Serif CJK KR","Source Han Serif K","Batang","바탕","Nanum Myeongjo","AppleMyungjo",serif;
  --cs:34px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);
  overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#33261b 0%,var(--bg) 60%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
svg{display:block}

#app{position:fixed;inset:0;height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px;
  padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left))}

/* 윗줄: 남은 지뢰 · 얼굴 · 시간 */
#top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.stat{display:flex;align-items:center;gap:8px;min-height:46px;padding:0 14px;border-radius:14px;background:var(--panel);border:1.5px solid var(--line)}
.stat svg{width:22px;height:22px;flex:none}
.stat b{font-family:var(--serif);font-size:26px;font-weight:900;color:var(--gold);letter-spacing:.04em;font-variant-numeric:tabular-nums;line-height:1}
#timeBox{justify-content:flex-end}
#mineBox{justify-content:flex-start}
#face{width:52px;height:52px;position:relative}
#face svg{width:100%;height:100%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
#face g{display:none}
#face[data-f="smile"] .f-smile,#face[data-f="dead"] .f-dead,#face[data-f="cool"] .f-cool{display:inline}
#face.bump{animation:bump .42s ease}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.18) rotate(-6deg)}70%{transform:scale(.96) rotate(3deg)}100%{transform:none}}

/* 판 */
#boardWrap{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0}
#board{display:grid;gap:var(--gap,2px);padding:var(--gap,2px);border-radius:14px;background:#120e0a;box-shadow:0 0 0 2px #4a3a2b,0 10px 30px rgba(0,0,0,.5);touch-action:none}
#board.shake{animation:shake .38s ease}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.cell{position:relative;width:var(--cs);height:var(--cs);border-radius:calc(var(--cs)*.2);
  background:linear-gradient(160deg,var(--wood1),var(--wood2) 62%,var(--wood3));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(95,58,16,.5);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--sans);font-weight:900;font-size:calc(var(--cs)*.58);line-height:1;transition:filter .12s}
.cell:active:not(.r){filter:brightness(1.12)}
.cell.r{background:#2c221a;box-shadow:inset 0 1px 3px rgba(0,0,0,.6);cursor:default}
.cell.press{filter:brightness(1.2)}
.cell svg{width:68%;height:68%}
.cell.f svg{animation:flagIn .18s cubic-bezier(.3,1.6,.5,1)}
@keyframes flagIn{from{transform:translateY(-35%) scale(.5);opacity:0}to{transform:none;opacity:1}}
.n1{color:#68b2ff}.n2{color:#62cf84}.n3{color:#ff7466}.n4{color:#b99aff}.n5{color:#ffad55}.n6{color:#3fd8cf}.n7{color:#ff93c8}.n8{color:#d6cdbd}
.cell.m{background:#2c221a}
.cell.m svg{color:var(--ink)}
.cell.x{background:var(--red);box-shadow:0 0 0 2px #ff9b8e inset,0 0 14px rgba(216,57,44,.8)}
.cell.x svg{color:#fff}
.cell.w{background:#2c221a}
.cell.w .cross{position:absolute;inset:14%;stroke:#ff7466;stroke-width:3;stroke-linecap:round}
.cell.pop{animation:pop .2s ease-out both}
@keyframes pop{0%{transform:scale(.55);opacity:.2}65%{transform:scale(1.1);opacity:1}100%{transform:none}}
.cell.cheer svg{animation:cheer .6s ease both}
@keyframes cheer{0%{transform:none}35%{transform:translateY(-22%) scale(1.25)}70%{transform:none}100%{transform:none}}
.cell.hintbox{outline:2px solid var(--gold);outline-offset:-2px}

/* 아래 단추 */
#bottom{display:grid;gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:6px 6px;min-height:50px;display:grid;gap:1px;align-content:center;
  transition:transform .12s,border-color .18s,background .18s,box-shadow .18s}
.seg button:active{transform:scale(.96)}
.seg button b{font-size:15.5px}
.seg button small{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{border-color:var(--gold);background:#43321f;box-shadow:0 0 0 3px rgba(227,176,75,.18)}
.acts{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px}
.act{white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:7px;min-height:52px;border-radius:14px;background:var(--panel);border:1.5px solid var(--line);font-weight:700;font-size:15px;
  transition:transform .12s,border-color .18s,background .18s,box-shadow .18s,opacity .18s}
.act:active{transform:scale(.96)}
.act svg{width:22px;height:22px;flex:none}
.act[aria-pressed="true"]{border-color:var(--gold);background:#43321f;box-shadow:0 0 0 3px rgba(227,176,75,.2);color:var(--gold)}
.act:disabled{opacity:.38;pointer-events:none}
.act.primary{background:linear-gradient(180deg,#ecbd58,#d19a32);border-color:#f3cc78;color:#2a1c08}
#note{min-height:1.3em;margin:0;text-align:center;color:var(--dim);font-size:12.5px}

/* 가로 화면: 판을 왼쪽, 단추를 오른쪽 */
@media (min-aspect-ratio:6/5){
  #app{grid-template-columns:minmax(0,1fr) 270px;grid-template-rows:auto minmax(0,1fr);gap:10px 12px;align-content:stretch}
  #boardWrap{grid-column:1;grid-row:1/3}
  #top{grid-column:2;grid-row:1;grid-template-columns:1fr 1fr;grid-template-areas:"mine time" "face face";gap:8px}
  #side{grid-column:2;grid-row:2;overflow-y:auto;min-height:0;padding:4px}
  .acts{grid-template-columns:1fr 1fr}
  .act.primary{grid-column:1/3}
  #face{grid-area:face;justify-self:center;width:44px;height:44px}
  #mineBox{grid-area:mine}#timeBox{grid-area:time}
  .stat{padding:0 10px;min-height:40px}
  .stat b{font-size:22px}
  .seg button{min-height:42px}
  .act{min-height:44px}
  #note{display:none}
}
/* 끝났을 때 쪽지 — 판을 가리지 않게 난이도 줄 자리에 뜬다 */
#end{background:rgba(52,38,24,.98);border:1.5px solid var(--gold);border-radius:14px;padding:9px 12px 10px;text-align:center;animation:rise .28s cubic-bezier(.3,1.3,.5,1) both;min-height:50px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#end[hidden]{display:none}
#end h2{margin:0 0 2px;font-family:var(--serif);font-size:19px;letter-spacing:.03em}
#end p{margin:0;color:var(--dim);font-size:13px;line-height:1.4}
#end.win h2{color:var(--gold)}
#end.lose h2{color:#ff8e82}
#bottom.ended #lvSeg{display:none}

/* 새 판 뒤 되돌리기 알림 */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));z-index:20;display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px);padding:8px 8px 8px 14px;background:rgba(52,38,24,.98);border:1.5px solid var(--gold);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.6);font-size:14px;animation:rise .25s ease both}
#toast[hidden]{display:none}
#toast button{white-space:nowrap;min-height:40px;padding:0 14px;border-radius:10px;background:linear-gradient(180deg,#ecbd58,#d19a32);color:#2a1c08;font-weight:800;font-size:14px}
@media (min-aspect-ratio:6/5){#toast{bottom:14px;left:calc(50% - 135px)}}
#tip{display:none;margin:0;color:var(--dim);font-size:12.5px;line-height:1.5}
@media (min-aspect-ratio:6/5){#tip{display:block}}

/* 이겼을 때 흩날리는 조각 */
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.bit{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),calc(var(--vh,700px) + 40px)) rotate(var(--rot));opacity:.9}}

html.calm *,html.calm *::before{animation:none!important;transition:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="stat" id="mineBox" aria-label="남은 지뢰">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-mine" style="color:#f3e9d8"/></svg><b id="mineLeft">0</b>
    </div>
    <div id="face" data-f="smile" aria-hidden="true">
      <svg viewBox="0 0 40 40">
        <defs><radialGradient id="fg" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#3f7a52"/><stop offset="1" stop-color="#1d4430"/></radialGradient></defs>
        <circle cx="20" cy="20" r="17.5" fill="url(#fg)" stroke="#e3b04b" stroke-width="2.2"/>
        <path d="M6 32q14-7 28 0v1H6Z" fill="#6b4b22"/>
        <g class="f-smile" transform="translate(20 22) scale(1.28) translate(-20 -22)"><path d="M20 31V19" stroke="#8fe0a4" stroke-width="2.4" stroke-linecap="round"/><path d="M20 21C12 22 9 16 10 12 16 12 20 15 20 21Z" fill="#62cf84"/><path d="M20 19C27 20 31 15 30 10 24 10 20 13 20 19Z" fill="#8fe0a4"/></g>
        <g class="f-dead" transform="translate(20 22) scale(1.28) translate(-20 -22)"><path d="M20 31C20 22 21 17 27 17" fill="none" stroke="#c9a06a" stroke-width="2.6" stroke-linecap="round"/><path d="M26 16C31 16 34 20 33 25 28 25 25 21 26 16Z" fill="#a98248"/><path d="M12 31l3-2 3 2" fill="none" stroke="#c9a06a" stroke-width="1.6" stroke-linecap="round"/></g>
        <g class="f-cool" transform="translate(20 22) scale(1.28) translate(-20 -22)"><path d="M20 31V18" stroke="#8fe0a4" stroke-width="2.4" stroke-linecap="round"/><path d="M20 27C14 28 11 24 12 21 17 21 20 23 20 27Z" fill="#62cf84"/><g fill="#ff93c8"><circle cx="20" cy="9.5" r="4"/><circle cx="25.2" cy="13.2" r="4"/><circle cx="23.2" cy="18.5" r="4"/><circle cx="16.8" cy="18.5" r="4"/><circle cx="14.8" cy="13.2" r="4"/></g><circle cx="20" cy="14.5" r="3.4" fill="#f7c948"/></g>
      </svg>
    </div>
    <div class="stat" id="timeBox" aria-label="걸린 시간">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#f3e9d8" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 8.5V13l3 2M9.5 2.8h5"/></svg><b id="timer">000</b>
    </div>
  </div>

  <div id="boardWrap">
    <div id="board" role="grid" aria-label="지뢰판"></div>
    <div id="fx"></div>
    </div>

  <div id="side">
    <div id="bottom">
      <div id="end" hidden></div>
      <div class="seg" id="lvSeg" role="group" aria-label="난이도"></div>
      <div class="acts">
        <button class="act" id="bUndo" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>무르기</button>
        <button class="act" id="bFlag" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><use href="#i-flag"/></svg>깃발 모드</button>
        <button class="act primary" id="bNew" type="button">새 판</button>
      </div>
      <p id="note">칸을 누르면 열리고, 꾹 누르면 깃발이 꽂힙니다.</p>
      <p id="tip">꾹 누르면 깃발이 꽂힙니다.<br>숫자를 누르면 주변이 한꺼번에 열립니다.</p>
    </div>
  </div>
</div>

<div id="toast" hidden role="status"><span>새 판을 시작했습니다.</span><button id="toastBtn" type="button">이전 판으로 되돌리기</button></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-mine" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4M5.3 5.3l2.8 2.8M15.9 15.9l2.8 2.8M18.7 5.3l-2.8 2.8M8.1 15.9l-2.8 2.8"/></g><circle cx="12" cy="12" r="6.2" fill="currentColor"/><circle cx="10" cy="10" r="1.8" fill="#fff" opacity=".75"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6.5 3.5v17" stroke="#6b4b22" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M7.5 4.2l12 4.6-12 4.6z" fill="#d8392c" stroke="#8c1d14" stroke-width="1.2" stroke-linejoin="round"/><rect x="3.5" y="19.3" width="7.5" height="2.6" rx="1.2" fill="#6b4b22"/></symbol>
  </defs>
</svg>

<script>
/* ==================== ENGINE-BEGIN ==================== */
/* 판 규칙만 담은 부분 — 화면과 무관(그대로 node 에서 시험한다). 바깥 변수를 쓰지 않는다. */
var LEVELS={easy:{rows:12,cols:9,mines:12,name:'쉬움'},mid:{rows:15,cols:10,mines:30,name:'보통'},hard:{rows:18,cols:12,mines:55,name:'어려움'}};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function newState(lv,rows,cols,mines){
  var n=rows*cols;
  return {lv:lv,rows:rows,cols:cols,mines:mines,n:n,mine:new Uint8Array(n),rev:new Uint8Array(n),flag:new Uint8Array(n),placed:false,status:'ready',flags:0,revCount:0,undos:0,moves:0};
}
function nb(G,i){
  var r=(i/G.cols)|0,c=i%G.cols,out=[];
  for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){
    if(!dr&&!dc)continue;
    var rr=r+dr,cc=c+dc;
    if(rr>=0&&rr<G.rows&&cc>=0&&cc<G.cols)out.push(rr*G.cols+cc);
  }
  return out;
}
function numAt(G,i){var s=0,a=nb(G,i);for(var k=0;k<a.length;k++)s+=G.mine[a[k]];return s;}
/* 첫 칸(과 이웃)은 지뢰에서 뺀다. 지뢰가 너무 많아 이웃까지 빼면 모자랄 때만 첫 칸 하나만 뺀다. */
function place(G,first,rng){
  var ban={};ban[first]=1;
  var ns=nb(G,first);
  if(G.n-(1+ns.length)>=G.mines){for(var k=0;k<ns.length;k++)ban[ns[k]]=1;}
  var pool=[];for(var i=0;i<G.n;i++)if(!ban[i])pool.push(i);
  for(var m=0;m<G.mines;m++){
    var j=m+Math.floor(rng()*(pool.length-m));
    var t=pool[m];pool[m]=pool[j];pool[j]=t;
    G.mine[pool[m]]=1;
  }
  G.placed=true;
}
/* 한 칸 열기(0 이면 번져 열림). 돌려주는 값: {opened:[[칸,깊이]…], hit:밟은 지뢰 칸 또는 -1} */
function revealAt(G,i,rng,out){
  if(G.rev[i]||G.flag[i])return;
  if(!G.placed)place(G,i,rng);
  if(G.mine[i]){if(out.hit<0)out.hit=i;return;}
  var q=[[i,0]];G.rev[i]=1;G.revCount++;
  for(var h=0;h<q.length;h++){
    var cur=q[h];out.opened.push(cur);
    if(numAt(G,cur[0])===0){
      var a=nb(G,cur[0]);
      for(var k=0;k<a.length;k++){var x=a[k];if(!G.rev[x]&&!G.flag[x]&&!G.mine[x]){G.rev[x]=1;G.revCount++;q.push([x,cur[1]+1]);}}
    }
  }
}
function finish(G,out){
  if(out.hit>=0){G.status='lost';}
  else if(G.revCount===G.n-G.mines){
    G.status='won';
    for(var i=0;i<G.n;i++)if(G.mine[i]&&!G.flag[i]){G.flag[i]=1;G.flags++;}
  }else G.status='play';
  out.status=G.status;
  return out;
}
/* 눌러서 열기 */
function actReveal(G,i,rng){
  var out={opened:[],hit:-1,changed:false,status:G.status};
  if(G.status==='won'||G.status==='lost'||G.rev[i]||G.flag[i])return out;
  revealAt(G,i,rng,out);out.changed=true;G.moves++;
  return finish(G,out);
}
/* 숫자 칸을 눌러 주변 한꺼번에 열기: 깃발 수가 숫자와 같을 때만. 깃발이 틀렸으면 지뢰를 밟는다. */
function actChord(G,i,rng){
  var out={opened:[],hit:-1,changed:false,status:G.status};
  if(G.status==='won'||G.status==='lost'||!G.rev[i])return out;
  var num=numAt(G,i),a=nb(G,i),f=0;
  for(var k=0;k<a.length;k++)f+=G.flag[a[k]];
  if(num===0||f!==num)return out;
  for(var k2=0;k2<a.length;k2++)revealAt(G,a[k2],rng,out);
  out.changed=true;G.moves++;
  return finish(G,out);
}
/* 깃발 꽂기/뽑기 */
function actFlag(G,i){
  if(G.status==='won'||G.status==='lost'||G.rev[i])return false;
  G.flag[i]=G.flag[i]?0:1;G.flags+=G.flag[i]?1:-1;
  if(G.status==='ready')G.status='ready';
  G.moves++;
  return true;
}
function snap(G){return {mine:G.mine.slice(),rev:G.rev.slice(),flag:G.flag.slice(),placed:G.placed,status:G.status,flags:G.flags,revCount:G.revCount,moves:G.moves};}
function restoreSnap(G,s){
  G.mine=s.mine.slice();G.rev=s.rev.slice();G.flag=s.flag.slice();G.placed=s.placed;G.status=s.status;G.flags=s.flags;G.revCount=s.revCount;G.moves=s.moves;
}
function enc(a){var s='';for(var i=0;i<a.length;i++)s+=a[i]?'1':'0';return s;}
function dec(s,n){var a=new Uint8Array(n);for(var i=0;i<n;i++)a[i]=s.charAt(i)==='1'?1:0;return a;}
function serialize(G,hist,ms){
  return {v:1,lv:G.lv,rows:G.rows,cols:G.cols,mines:G.mines,mine:enc(G.mine),rev:enc(G.rev),flag:enc(G.flag),placed:G.placed,status:G.status,undos:G.undos,t:ms,
    moves:hist.map(function(h){return [enc(h.mine),enc(h.rev),enc(h.flag),h.placed?1:0,h.status];}),mc:G.moves};
}
function deserialize(o){
  if(!o||o.v!==1||!LEVELS[o.lv])return null;
  var L=LEVELS[o.lv];if(o.rows!==L.rows||o.cols!==L.cols||o.mines!==L.mines)return null;
  var n=o.rows*o.cols;
  if(typeof o.mine!=='string'||o.mine.length!==n||o.rev.length!==n||o.flag.length!==n)return null;
  var G=newState(o.lv,o.rows,o.cols,o.mines);
  G.mine=dec(o.mine,n);G.rev=dec(o.rev,n);G.flag=dec(o.flag,n);G.placed=!!o.placed;G.status=o.status;G.undos=o.undos|0;G.moves=o.mc|0;
  for(var i=0;i<n;i++){G.revCount+=G.rev[i];G.flags+=G.flag[i];}
  var hist=[];
  (o.moves||[]).forEach(function(h){
    var s={mine:dec(h[0],n),rev:dec(h[1],n),flag:dec(h[2],n),placed:!!h[3],status:h[4],flags:0,revCount:0,moves:0};
    for(var k=0;k<n;k++){s.flags+=s.flag[k];s.revCount+=s.rev[k];}
    hist.push(s);
  });
  for(var q=0;q<hist.length;q++)hist[q].moves=q;
  return {G:G,hist:hist,ms:+o.t||0};
}
/* ==================== ENGINE-END ==================== */

(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var KEY_GAME='mines.game.v1',KEY_BEST='mines.best.v1',KEY_SET='mines.set.v1';
function lsGet(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}

/* 움직임 줄이기: 폰 설정 또는 스마트비서의 「움직임 줄이기」 */
var calm=false;
try{calm=window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
try{var pr=parent&&parent!==window&&parent.document.getElementById('gameRoot');if(pr&&pr.classList.contains('calm'))calm=true;}catch(e){}
if(calm)document.documentElement.classList.add('calm');

var G=null,hist=[],lv='easy',flagMode=false,wide=false;
var elapsed=0,lastTick=0,timerId=0;
var cells=[],boardEl=$('board'),endEl=$('end');
var seedRng=mulberry32((Date.now()^(Math.random()*4294967296))>>>0);

function best(){return lsGet(KEY_BEST)||{};}
function fmt(t){t=Math.min(999,Math.max(0,Math.floor(t/1000)));return ('00'+t).slice(-3);}

/* ---------- 화면 모양 ---------- */
function isWide(){return window.innerWidth>=window.innerHeight*1.2;}
function layout(){
  wide=isWide();
  var dr=wide?G.cols:G.rows,dc=wide?G.rows:G.cols;   // 가로 화면에선 판을 눕혀 보여 준다(칸 번호는 그대로)
  boardEl.style.setProperty('--dc',dc);
  boardEl.style.gridTemplateColumns='repeat('+dc+',var(--cs))';
  var wrap=$('boardWrap'),W=wrap.clientWidth-8,H=wrap.clientHeight-8;
  var gap=2;
  var cs=Math.floor(Math.min((W-gap*(dc+1))/dc,(H-gap*(dr+1))/dr,48));
  if(cs<14)cs=14;
  boardEl.style.setProperty('--cs',cs+'px');boardEl.style.setProperty('--gap',gap+'px');
  for(var i=0;i<G.n;i++){
    var r=(i/G.cols)|0,c=i%G.cols,el=cells[i];
    el.style.gridRowStart=(wide?c:r)+1;el.style.gridColumnStart=(wide?r:c)+1;
  }
  document.documentElement.style.setProperty('--vh',window.innerHeight+'px');
}
function buildBoard(){
  boardEl.innerHTML='';cells=[];
  for(var i=0;i<G.n;i++){var d=document.createElement('div');d.className='cell';d.dataset.i=i;d.setAttribute('role','gridcell');boardEl.appendChild(d);cells.push(d);}
  layout();
}
var FLAG='<svg viewBox="0 0 24 24"><use href="#i-flag"/></svg>',MINE='<svg viewBox="0 0 24 24"><use href="#i-mine"/></svg>';
function paint(i){
  var el=cells[i],cls='cell',html='';
  if(G.rev[i]){
    cls+=' r';var n=numAt(G,i);
    if(n>0){cls+=' n'+n;html=''+n;}
  }else if(G.status==='lost'&&G.mine[i]&&!G.flag[i]){cls+=' r m';html=MINE;}
  else if(G.status==='lost'&&G.flag[i]&&!G.mine[i]){cls+=' r w';html=MINE.replace('<svg viewBox="0 0 24 24">','<svg viewBox="0 0 24 24" style="opacity:.55">')+'<svg class="cross" viewBox="0 0 24 24" fill="none"><path d="M4 4l16 16M20 4L4 20"/></svg>';}
  else if(G.flag[i]){cls+=' f';html=FLAG;}
  if(el.dataset.x==='1')cls+=' x r';
  if(el.className.indexOf('pop')>=0)cls+=' pop';
  if(el.className.indexOf('cheer')>=0)cls+=' cheer';
  if(el.className!==cls)el.className=cls;
  if(el.innerHTML!==html)el.innerHTML=html;
}
function paintAll(){for(var i=0;i<G.n;i++)paint(i);head();}
function head(){
  $('mineLeft').textContent=G.mines-G.flags;
  $('timer').textContent=fmt(elapsed);
  $('bUndo').disabled=!hist.length||G.status==='won';
  var f='smile';if(G.status==='lost')f='dead';else if(G.status==='won')f='cool';
  if($('face').dataset.f!==f){$('face').dataset.f=f;bump();}
  $('bFlag').setAttribute('aria-pressed',flagMode?'true':'false');
  var seg=$('lvSeg').children,b=best();
  for(var k=0;k<seg.length;k++){
    var key=seg[k].dataset.lv;seg[k].setAttribute('aria-pressed',key===lv?'true':'false');
    seg[k].querySelector('small').textContent=LEVELS[key].mines+'개'+(b[key]?' · 최고 '+b[key]+'초':'');
  }
}
function bump(){var f=$('face');if(calm)return;f.classList.remove('bump');void f.offsetWidth;f.classList.add('bump');}
function note(t){$('note').textContent=t;}
function vib(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}

/* ---------- 시간 ---------- */
function tickStart(){
  if(timerId)return;lastTick=performance.now();
  timerId=setInterval(function(){
    var n=performance.now();if(!document.hidden)elapsed+=n-lastTick;lastTick=n;
    $('timer').textContent=fmt(elapsed);
  },250);
}
function tickStop(){if(timerId){clearInterval(timerId);timerId=0;}}

/* ---------- 저장 ---------- */
function save(){
  if(!G)return;
  if(G.status==='won'||G.status==='lost'||(G.status==='ready'&&!G.moves&&!hist.length)){lsDel(KEY_GAME);return;}
  lsSet(KEY_GAME,serialize(G,hist,elapsed));
}
function saveSet(){lsSet(KEY_SET,{lv:lv});}

/* ---------- 새 판 ---------- */
function startNew(level){
  lv=level;var L=LEVELS[lv];
  G=newState(lv,L.rows,L.cols,L.mines);hist=[];elapsed=0;flagMode=false;
  tickStop();endEl.hidden=true;$('bottom').classList.remove('ended');$('fx').innerHTML='';
  buildBoard();paintAll();saveSet();lsDel(KEY_GAME);
  note('칸을 누르면 열리고, 꾹 누르면 깃발이 꽂힙니다.');
}
function inProgress(){return G&&(G.status==='play'||G.status==='ready')&&hist.length>=1;}
var stash=null,toastT=0;
function hideToast(){clearTimeout(toastT);$('toast').hidden=true;}
function askNew(level){
  var prev=inProgress()?{G:G,hist:hist,elapsed:elapsed,lv:lv}:null;
  startNew(level);
  if(!prev){hideToast();return;}
  stash=prev;$('toast').hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){$('toast').hidden=true;stash=null;},5800);
}
$('toastBtn').addEventListener('click',function(){
  if(!stash)return;var p=stash;stash=null;hideToast();
  tickStop();G=p.G;hist=p.hist;elapsed=p.elapsed;lv=p.lv;flagMode=false;endEl.hidden=true;$('bottom').classList.remove('ended');
  buildBoard();paintAll();if(G.status==='play')tickStart();saveSet();save();note('이전 판으로 돌아왔습니다.');
});

/* ---------- 행동 ---------- */
function pushHist(){hist.push(snap(G));if(hist.length>400)hist.shift();}
function apply(out,wasStatus){
  var delay=function(d){return calm?0:Math.min(d*24,420);};
  out.opened.forEach(function(o){
    var el=cells[o[0]];
    if(!calm){el.classList.add('pop');el.style.animationDelay=delay(o[1])+'ms';
      el.addEventListener('animationend',function f(){el.classList.remove('pop');el.style.animationDelay='';el.removeEventListener('animationend',f);});}
    paint(o[0]);
  });
  if(G.status==='play'&&!timerId)tickStart();
  if(out.hit>=0)lose(out.hit);
  else if(G.status==='won')win();
  else{for(var i=0;i<G.n;i++)paint(i);head();}
}
function doReveal(i){
  if(G.status==='won'||G.status==='lost')return;
  if(G.rev[i]){doChord(i);return;}
  if(G.flag[i]){note('깃발이 꽂힌 칸입니다. 꾹 누르면 깃발이 뽑힙니다.');return;}
  pushHist();
  var out=actReveal(G,i,seedRng);
  apply(out);save();
}
function doChord(i){
  var a=nb(G,i),f=0;for(var k=0;k<a.length;k++)f+=G.flag[a[k]];
  var n=numAt(G,i);
  if(f!==n){   // 깃발 수가 모자라거나 넘치면 열지 않고 주변을 잠깐 밝힌다
    a.forEach(function(x){if(!G.rev[x]&&!G.flag[x]){cells[x].classList.add('press');setTimeout(function(){cells[x].classList.remove('press');},260);}});
    note(f<n?'주변 깃발이 숫자보다 적습니다.':'주변 깃발이 숫자보다 많습니다.');
    return;
  }
  pushHist();
  var out=actChord(G,i,seedRng);
  if(!out.changed){hist.pop();return;}
  apply(out);save();
}
function doFlag(i){
  if(G.status==='won'||G.status==='lost')return;
  if(G.rev[i]){doChord(i);return;}
  pushHist();
  actFlag(G,i);paint(i);head();vib(14);save();
}
function lose(hit){
  tickStop();
  var el=cells[hit];el.dataset.x='1';
  face_wow_off();
  var delay=0;
  for(var i=0;i<G.n;i++){
    if(i!==hit&&G.mine[i]&&!G.flag[i]&&!calm){cells[i].classList.add('pop');cells[i].style.animationDelay=(delay++%14)*30+'ms';}
    paint(i);
  }
  head();note('');vib([40,60,40]);
  if(!calm){boardEl.classList.remove('shake');void boardEl.offsetWidth;boardEl.classList.add('shake');}
  save();
  showEnd('lose','지뢰를 밟았습니다','아래 ‘무르기’로 직전 수를 되돌릴 수 있습니다.');
}
function face_wow_off(){}
function win(){
  tickStop();
  var sec=Math.max(1,Math.ceil(elapsed/1000));
  var b=best(),rec=false;
  if(G.undos===0&&(!b[lv]||sec<b[lv])){b[lv]=sec;lsSet(KEY_BEST,b);rec=true;}
  for(var i=0;i<G.n;i++){if(G.flag[i]&&!calm){cells[i].classList.add('cheer');cells[i].style.animationDelay=((i*37)%12)*45+'ms';}paint(i);}
  head();note('');confetti();vib([30,50,30,50,90]);lsDel(KEY_GAME);
  var msg=sec+'초 걸렸습니다.';
  if(rec)msg+=' 이 난이도 최고 기록입니다.';
  else if(G.undos>0)msg+=' (무르기를 쓴 판은 기록에 오르지 않습니다.)';
  showEnd('win','모든 지뢰를 피했습니다',msg);
}
function showEnd(kind,title,msg){
  endEl.className=kind;
  endEl.innerHTML='<h2>'+title+'</h2><p>'+msg+'</p>';
  endEl.hidden=false;$('bottom').classList.add('ended');
}
function confetti(){
  if(calm)return;
  var fx=$('fx'),cols=['#e3b04b','#ff7466','#68b2ff','#62cf84','#b99aff','#ffad55'];
  fx.innerHTML='';
  for(var k=0;k<34;k++){
    var b=document.createElement('i');b.className='bit';
    b.style.left=(Math.random()*100)+'%';b.style.background=cols[k%cols.length];
    b.style.setProperty('--dx',((Math.random()-.5)*120)+'px');b.style.setProperty('--rot',(Math.random()*720-360)+'deg');
    b.style.animationDuration=(1.6+Math.random()*1.4)+'s';b.style.animationDelay=(Math.random()*.5)+'s';
    b.style.setProperty('--vh',($('boardWrap').clientHeight)+'px');
    fx.appendChild(b);
  }
  setTimeout(function(){fx.innerHTML='';},4200);
}
function undo(){
  if(!hist.length)return;
  var s=hist.pop(),was=G.status;
  restoreSnap(G,s);G.undos++;
  if(G.status==='ready'&&!G.placed){elapsed=0;}
  for(var i=0;i<G.n;i++){delete cells[i].dataset.x;}
  endEl.hidden=true;$('bottom').classList.remove('ended');$('fx').innerHTML='';
  boardEl.classList.remove('shake');
  paintAll();
  if(G.status==='play')tickStart();else if(G.status!=='play')tickStop();
  note('한 수를 되돌렸습니다.');save();
}

/* ---------- 손가락 ---------- */
var press=null,LONG=420;
boardEl.addEventListener('contextmenu',function(e){e.preventDefault();});
boardEl.addEventListener('pointerdown',function(e){
  var c=e.target.closest&&e.target.closest('.cell');if(!c)return;
  if(e.button===2){e.preventDefault();doFlag(+c.dataset.i);return;}
  if(e.button>0)return;
  var i=+c.dataset.i;
  press={i:i,x:e.clientX,y:e.clientY,done:false,id:e.pointerId};
  note('');
  press.timer=setTimeout(function(){if(press&&!press.done){press.done=true;doFlag(press.i);}},LONG);
});
boardEl.addEventListener('pointermove',function(e){
  if(!press)return;
  if(Math.abs(e.clientX-press.x)>12||Math.abs(e.clientY-press.y)>12){clearTimeout(press.timer);press.done=true;faceBack();}
});
function faceBack(){}
boardEl.addEventListener('pointerup',function(e){
  if(!press)return;
  var p=press;press=null;clearTimeout(p.timer);faceBack();
  if(p.done)return;
  if(flagMode&&!G.rev[p.i])doFlag(p.i);else doReveal(p.i);
});
boardEl.addEventListener('pointercancel',function(){if(press){clearTimeout(press.timer);press=null;faceBack();}});
boardEl.addEventListener('pointerleave',function(){if(press){clearTimeout(press.timer);press=null;faceBack();}});

/* ---------- 단추 ---------- */
$('bUndo').addEventListener('click',undo);
$('bFlag').addEventListener('click',function(){flagMode=!flagMode;head();note(flagMode?'깃발 모드입니다. 칸을 누르면 깃발이 꽂히고 뽑힙니다.':'칸을 누르면 열립니다.');});
$('bNew').addEventListener('click',function(){askNew(lv);});
(function(){
  var seg=$('lvSeg');
  Object.keys(LEVELS).forEach(function(k){
    var b=document.createElement('button');b.type='button';b.dataset.lv=k;
    b.innerHTML='<b>'+LEVELS[k].name+'</b><small></small>';
    b.addEventListener('click',function(){if(k===lv)return;askNew(k);});
    seg.appendChild(b);
  });
})();
window.addEventListener('resize',function(){if(G)layout();});
window.addEventListener('orientationchange',function(){setTimeout(function(){if(G)layout();},120);});
document.addEventListener('visibilitychange',function(){if(document.hidden)save();else lastTick=performance.now();});
window.addEventListener('pagehide',save);

/* 스마트비서 앱의 뒤로 가기: 열린 쪽지가 있으면 그것부터 닫는다(없으면 false → 앱이 게임 층을 닫음) */
window.__gameBack=function(){return false;};

/* ---------- 시작 ---------- */
var set=lsGet(KEY_SET),saved=deserialize(lsGet(KEY_GAME));
if(saved&&saved.G.status!=='won'&&saved.G.status!=='lost'){
  G=saved.G;hist=saved.hist;lv=G.lv;elapsed=saved.ms;
  buildBoard();paintAll();
  if(G.status==='play')tickStart();
  note('이어서 하는 판입니다.');
}else{
  lv=(set&&LEVELS[set.lv])?set.lv:'easy';startNew(lv);
}
window.__mines={get G(){return G;},get hist(){return hist;},startNew:startNew,undo:undo,doReveal:doReveal,doFlag:doFlag,doChord:doChord,get lv(){return lv;},layout:layout,paintAll:paintAll};
requestAnimationFrame(layout);
})();
</script>
